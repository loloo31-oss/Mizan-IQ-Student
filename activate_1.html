<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفعيل Mizan IQ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D3B6E,#185FA5);font-family:Arial,sans-serif}
.box{background:#fff;border-radius:20px;padding:40px;width:460px;max-width:95vw;box-shadow:0 24px 64px rgba(0,0,0,.3);text-align:center}
.brand{font-size:36px;font-weight:900;margin-bottom:8px}
.brand span:first-child{color:#185FA5}
.brand span:last-child{color:#B8860B}
.sub{font-size:12px;color:#666;margin-bottom:24px}
.warn{background:#FEF3C7;border:1px solid #F59E0B;border-radius:10px;padding:14px;margin-bottom:20px;font-size:13px;color:#92400E}
.err{background:#FEE2E2;border:1px solid #EF4444;border-radius:8px;padding:12px;margin-bottom:18px;font-size:13px;color:#B91C1C;display:none}
label{font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:6px;text-align:right}
input{width:100%;padding:12px 14px;border:2px solid #D1D5DB;border-radius:10px;font-size:15px;font-family:monospace;text-align:center;letter-spacing:2px;text-transform:uppercase;outline:none;transition:border .2s}
input:focus{border-color:#185FA5}
button{width:100%;padding:13px;background:#185FA5;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:background .2s}
button:hover{background:#0D3B6E}
button:disabled{background:#9CA3AF;cursor:not-allowed}
.msg{font-size:13px;color:#6B7280;min-height:24px;margin-top:12px}
.footer{font-size:11px;color:#9CA3AF;border-top:1px solid #E5E7EB;padding-top:16px;margin-top:20px}
.footer a{color:#185FA5;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span>Mizan </span><span>IQ</span></div>
  <div class="sub">الذكاء الذي يفهم أرقامك</div>
  <div class="warn">🔐 هذه النسخة محمية بحقوق الملكية الفكرية</div>
  <div class="err" id="errBox"></div>
  <label>🔑 مفتاح التفعيل</label>
  <input type="text" id="keyInput" placeholder="MIZAN-XXXX-XXXX-XXXX" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
  <div style="margin-top:16px;text-align:right">
    <label style="font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:6px">👤 اسم المستخدم</label>
    <input type="text" id="userInput" placeholder="اختر اسم مستخدم" autocomplete="off" style="width:100%;padding:12px 14px;border:2px solid #D1D5DB;border-radius:10px;font-size:14px;text-align:right;outline:none;margin-bottom:12px">
    <label style="font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:6px">🔒 كلمة المرور</label>
    <input type="password" id="passInput" placeholder="اختر كلمة مرور" autocomplete="off" style="width:100%;padding:12px 14px;border:2px solid #D1D5DB;border-radius:10px;font-size:14px;text-align:right;outline:none">
  </div>
  <button id="activateBtn">🚀 تفعيل البرنامج</button>
  <div class="msg" id="msgBox"></div>
  <div class="footer">
    خالد العمري — Mizan IQ<br>
    <a href="mailto:loloo31@gmail.com">loloo31@gmail.com</a>
  </div>
</div>

<script>
var KEY_PATTERN=/^MIZAN-[A-Z0-9]{4,8}-[A-Z0-9]{4,8}-[A-Z0-9]{4,8}$/;
var inp=document.getElementById('keyInput');
var btn=document.getElementById('activateBtn');
var msg=document.getElementById('msgBox');
var err=document.getElementById('errBox');

// Check if already activated
var stored=localStorage.getItem('mizan_license');
if(stored){
  try{
    var lic=JSON.parse(stored);
    if(lic&&lic.key&&lic.valid){
      window.location.href='index.html';
    }
  }catch(e){}
}

inp.addEventListener('input',function(){
  this.value=this.value.toUpperCase();
  err.style.display='none';
});

inp.addEventListener('keydown',function(e){
  if(e.key==='Enter') activate();
});

btn.addEventListener('click',activate);

function activate(){
  var key=inp.value.trim().toUpperCase();
  var user=document.getElementById('userInput').value.trim();
  var pass=document.getElementById('passInput').value.trim();
  err.style.display='none';
  msg.textContent='';

  if(!key){showErr('أدخل مفتاح التفعيل');return;}
  if(!KEY_PATTERN.test(key)){showErr('صيغة المفتاح غير صحيحة');return;}
  if(!user){showErr('أدخل اسم المستخدم');return;}
  if(user.length<3){showErr('اسم المستخدم 3 أحرف على الأقل');return;}
  if(!pass){showErr('أدخل كلمة المرور');return;}
  if(pass.length<4){showErr('كلمة المرور 4 أحرف على الأقل');return;}

  btn.disabled=true;
  msg.textContent='جاري التفعيل...';

  // Hash password simply
  var hash=0;
  for(var i=0;i<pass.length;i++){hash=((hash<<5)-hash)+pass.charCodeAt(i);hash|=0;}
  hash=Math.abs(hash).toString(16);

  // Save license
  var lic={key:key,valid:true,username:user,activatedAt:new Date().toISOString()};
  localStorage.setItem('mizan_license',JSON.stringify(lic));

  // Save user account to be created on first login
  var account={username:user,passwordHash:hash,name:user,role:'user',active:true,firstLogin:true};
  localStorage.setItem('mizan_pending_user',JSON.stringify(account));

  msg.innerHTML='<span style="color:#059669">✅ تم التفعيل! مرحباً '+user+'<br>جاري التحميل...</span>';
  setTimeout(function(){window.location.href='index.html';},1800);
}

function showErr(text){
  err.textContent='⚠️ '+text;
  err.style.display='block';
  btn.disabled=false;
  msg.textContent='';
}
</script>
</body>
</html>
