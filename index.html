<title>Mizan IQ — ميزان IQ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f3;--sf:#fff;--bd:#e4e2db;--bd2:#c5c2b8;--tx:#1a1916;--t2:#68665e;--t3:#9a978f;
--gn:#1a7a4a;--gnb:#eef8f2;--bl:#1e4fd8;--blb:#eef2ff;--am:#b45309;--amb:#fff7e0;

body{font-family:Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:240px;min-width:200px;background:#185FA5;border-right:none;display:flex;flex-direction:column;overflow:hidden}
.logo{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.15)}
.logo h2{font-size:14px;font-weight:700;color:white}.logo p{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px}
.sv{font-size:11px;padding:5px 16px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.9);border-bottom:1px solid rgba(255,255,255,0.1)}
nav{flex:1;overflow-y:auto;padding:6px 0}
.ns{font-size:10px;font-weight:700;color:rgba(255,255,255,0.45);padding:9px 16px 3px;text-transform:uppercase;letter-spacing:.07em}
.nacc{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 9px 14px;cursor:pointer;font-size:10px;font-weight:700;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid rgba(255,255,255,0.06);user-select:none;transition:background .15s}
.nacc:hover{background:rgba(255,255,255,0.07)}
.nacc-lbl{flex:1}
.nacc-arr{font-size:16px;transition:transform .22s;line-height:1;color:rgba(255,255,255,0.4)}
.nacc-body{overflow:hidden;transition:max-height .25s ease;max-height:0}
.ni{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.8);border-left:3px solid transparent;transition:background .12s;white-space:nowrap;overflow:hidden}
.ni:hover{background:rgba(255,255,255,0.12);color:white}.ni.active{background:rgba(255,255,255,0.18);color:white;font-weight:600;border-left-color:white}
.ni svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.btn svg{width:14px;height:14px;flex-shrink:0;vertical-align:middle}
.sbf{padding:10px 14px;border-top:1px solid rgba(255,255,255,0.15);display:flex;gap:6px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--sf);gap:10px;flex-wrap:wrap}
.tb h1{font-size:15px;font-weight:700}.ta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pg{flex:1;overflow-y:auto;padding:20px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--bd2);border-radius:var(--r);cursor:pointer;font-size:12px;background:var(--sf);color:var(--tx);font-family:Arial,sans-serif;transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--bg)}.bp{background:var(--tx);color:var(--sf);border-color:var(--tx)}.bp:hover{opacity:.88}
.bdr{color:var(--rd);border-color:#fca5a5}.bdr:hover{background:var(--rdb)}

.bsm{padding:3px 9px;font-size:11px}
.tw{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;color:var(--t2);padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--bg);text-transform:uppercase;letter-spacing:.04em}
th:last-child{width:80px;min-width:80px}
td:last-child{padding:4px 6px}
td{padding:8px 12px;border-bottom:1px solid var(--bd)}
td:last-child{width:72px}tr:last-child td{border-bottom:none}tr:hover td{background:var(--bg)}
.mn{font-family:'Courier New',monospace;font-size:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.ct{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg{display:grid;gap:12px;padding:18px 22px;overflow-y:auto;flex:1;min-height:0}

input,select{width:100%;padding:7px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:13px;background:var(--sf);color:var(--tx);font-family:Arial,sans-serif}

.met{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:12px 15px}
.mlab{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.mv{font-size:18px;font-weight:700}.mv.pos{color:var(--gn)}.mv.neg{color:var(--rd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--sf);border-radius:var(--rl);border:1px solid var(--bd);padding:0;width:900px;max-width:98vw;max-height:92vh;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.15);display:flex;flex-direction:column}
.mh{font-size:14px;font-weight:700;padding:18px 22px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.modal{direction:inherit}
.mft{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--bd);flex-shrink:0;background:var(--sf);border-radius:0 0 var(--rl) var(--rl)}
.rr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--bd)}.rr:last-child{border-bottom:none}
.rt{display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:13px;border-top:2px solid var(--bd2);margin-top:3px}
.rh{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--bd)}.rh:first-child{margin-top:0}

<script>
// ── Mizan IQ real backend: auth + licenses ONLY ────────────────────
// This is intentionally separate from the older, still-unused
// HAS_CLOUD/accountpro-db block further down (its FB_CONFIG variable is
// deliberately left undefined so that legacy full-data-sync code stays
// inert). This config powers exactly two things: real trainee sign-up/
// sign-in (Firebase Authentication, replacing the old locally-hashed
// password check) and a real license registry (Realtime Database, under
// /licenses and /users) that the admin panel and every trainee device can
// both see live. Accounting data itself (chart of accounts, journals,
// invoices, etc.) is NOT part of this and stays local per device, exactly
// as before.
var MIZAN_FB_CONFIG={
 apiKey:"AIzaSyBi0ac-BIAl1M8DvCuAZRORF5HzIm0m89k",
 authDomain:"account-pro-d511d.firebaseapp.com",
 databaseURL:"https://account-pro-d511d-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"account-pro-d511d",
 storageBucket:"account-pro-d511d.firebasestorage.app",
 messagingSenderId:"63478300303",
 appId:"1:63478300303:web:a44d0207835c4e7ad47afa"
};
// Trainees only ever type a username — Firebase Authentication's
// email/password provider needs something shaped like an email, so we
// silently map username -> username@<this fake domain>. It never has to
// resolve to a real mailbox; Firebase never sends anything to it.
var MIZAN_AUTH_DOMAIN='mizaniq-trainees.app';
// A single fixed service account used ONLY so the admin panel's writes to
// /licenses (issuing, suspending, renewing) are allowed by the database
// security rules below, without changing how you log into the admin panel
// itself (that stays local/unchanged). It auto-creates itself on first use.
var MIZAN_SERVICE_EMAIL='service@mizaniq-app.internal';
var MIZAN_SERVICE_PASSWORD='Mzn-Svc-9f3Kx72Qz-Admin!';
try{
 firebase.initializeApp(MIZAN_FB_CONFIG);
 window.mizanAuth=firebase.auth();
 window.mizanLicensesRef=firebase.database().ref('licenses');
 window.mizanUsersRef=firebase.database().ref('users');
}catch(e){ console.error('Mizan Firebase init failed',e); }
function usernameToEmail(u){
 return String(u||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'')+'@'+MIZAN_AUTH_DOMAIN;
}
window.usernameToEmail=usernameToEmail;
function ensureServiceAdminAuth(){
 if(!window.mizanAuth)return Promise.reject(new Error('no-auth'));
 var cu=window.mizanAuth.currentUser;
 if(cu&&cu.email===MIZAN_SERVICE_EMAIL)return Promise.resolve(cu);
 // Try creating the service account first (only ever succeeds once, the
 // very first time this ever runs on a device), then fall back to signing
 // in if it already exists. This order is deliberate: newer Firebase Auth
 // versions return the generic 'auth/invalid-credential' (not the older,
 // more specific 'auth/user-not-found') when signing in to an account that
 // doesn't exist yet, which made the previous sign-in-first order unable
 // to reliably detect "doesn't exist yet" and auto-create it.
 // 'auth/email-already-in-use' from createUser, by contrast, is still an
 // unambiguous signal, so leading with create-then-fall-back-to-sign-in
 // works reliably either way.
 return window.mizanAuth.createUserWithEmailAndPassword(MIZAN_SERVICE_EMAIL,MIZAN_SERVICE_PASSWORD)
  .then(function(cred){return cred.user;})
  .catch(function(err){
   if(err&&err.code==='auth/email-already-in-use'){
    return window.mizanAuth.signInWithEmailAndPassword(MIZAN_SERVICE_EMAIL,MIZAN_SERVICE_PASSWORD).then(function(cred){return cred.user;});
   }
   throw err;
  });
}
window.ensureServiceAdminAuth=ensureServiceAdminAuth;
</script>

// ── Auto sub-ledger account generation for Customers/Suppliers ──────────
// When a new customer/supplier is added (see mSaveContact), or when an
// existing one is missing a valid linked account (see the normalizeDB()
// backfill below), the app auto-creates a dedicated sub-ledger account for
// it under the correct parent: Local/Foreign Customers (1103-01/1103-02)
// for customers, Local/Foreign Suppliers (2101-01/2101-02) for suppliers --
// picked by whether the contact's country is Saudi Arabia -- falling back
// to the main Accounts Receivable/Payable account (1103/2101) directly if
// those specific sub-accounts don't exist in the current COA (e.g. after a
// different chart was imported). Generated codes look like "1103-01-001".
// These helpers take the accounts array explicitly (rather than reading the
// global db) because normalizeDB() also runs before `db` itself is set.
function contactParentAccId(accountsArr,isSup,country){
 var isForeign=!!country&&country!=='Saudi Arabia';
 var candidates=isSup
  ?(isForeign?['2101-02','2101']:['2101-01','2101'])
  :(isForeign?['1103-02','1103']:['1103-01','1103']);
 for(var i=0;i<candidates.length;i++){
  if(accountsArr.some(function(a){return a.id===candidates[i];}))return candidates[i];
 }
 return null;
}
function genSubLedgerAccId(accountsArr,parentId){
 var prefix=parentId+'-';
 var maxN=0;
 accountsArr.forEach(function(a){
  if(a.id.indexOf(prefix)===0){
   var rest=a.id.slice(prefix.length);
   if(/^\d+$/.test(rest)){var n=parseInt(rest,10);if(n>maxN)maxN=n;}
  }
 });
 var seq=String(maxN+1);
 while(seq.length<3)seq='0'+seq;
 return prefix+seq;
}
function autoCreateContactAccount(accountsArr,isSup,contact){
 var parentId=contactParentAccId(accountsArr,isSup,contact.country);
 if(!parentId)return '';
 var newId=genSubLedgerAccId(accountsArr,parentId);
 accountsArr.push({
  id:newId,
  name:contact.name||newId,
  nameAr:contact.nameAr||'',
  type:isSup?'Liability':'Asset',
  normal:isSup?'Credit':'Debit',
  bal:0,
  isMain:false,
  pid:parentId,
  autoGen:true
 });
 return newId;
}
function normalizeDB(d){
 if(!d.exp)d.exp={};
 if(!d.customers)d.customers=[];
 if(!d.suppliers)d.suppliers=[];
 if(!d.receipts)d.receipts=[];
 if(!d.payments)d.payments=[];
 if(!d.costCenters)d.costCenters=[];
 if(!d.items)d.items=[];
 if(!d.purchaseInvoices)d.purchaseInvoices=[];
 if(!d.purchaseOrders)d.purchaseOrders=[];
 if(!d.fiscalYears)d.fiscalYears=[];
 if(!d.budgets)d.budgets=[];
 if(!d.salesInvoices2)d.salesInvoices2=[];
 d.items.forEach(function(it){if(it.qty===undefined)it.qty=0;if(it.avgCost===undefined)it.avgCost=0;});
 if(!d.fixedAssets)d.fixedAssets=[];
 if(!d.assetLocations)d.assetLocations=[{id:'LOC001',name:'Head Office'},{id:'LOC002',name:'Branch 1'}];
 if(!d.assetTransactions)d.assetTransactions=[];
 // Ensure each asset has required fields
 d.fixedAssets.forEach(function(a){
  if(!a.transactions)a.transactions=[];
  if(a.salvageValue===undefined)a.salvageValue=0;
  if(a.accDepreciation===undefined)a.accDepreciation=0;
 });
 if(!d.company.currency)d.company.currency='SAR';
 if(d.company.logo===undefined)d.company.logo='';
 if(!d.users||!d.users.length){d.users=[{id:'admin',name:'Administrator',username:'admin',passwordHash:hashPwd('admin123'),role:'admin',active:true,perms:{}}];}
 // Ensure admin always exists
 var adminUser=d.users.find(function(u){return u.role==='admin';});
 if(!adminUser){d.users.unshift({id:'admin',name:'Administrator',username:'admin',passwordHash:hashPwd('admin123'),role:'admin',active:true,perms:{}});}
 // Migrate plain passwords to hashed
 d.users.forEach(function(u){
  if(u.password&&!u.passwordHash){u.passwordHash=hashPwd(u.password);delete u.password;}
  // If somehow admin has no passwordHash, set default
  if(u.role==='admin'&&!u.passwordHash){u.passwordHash=hashPwd('admin123');}
 });
 if(!d.users)d.users=[];
 if(d.company.vatRate===undefined)d.company.vatRate=15;
 // Self-heal a company stamp/signature that ended up as an unusable data
 // URI (e.g. from the 0px-canvas edge case fixed in wireImageUploadField)
 // -- it would otherwise sit there forever as a "truthy but invisible"
 // value, silently failing to render on the Balance Confirmation Letter
 // and everywhere else it's used, with no way for the user to tell it's
 // broken versus just not-yet-uploaded. Clearing it here just reverts to
 // the normal "no stamp/signature uploaded" state so it can be re-uploaded.
 ['stamp','signature','logo'].forEach(function(f){
  var v=d.company[f];
  if(v&&!/^data:image\/[a-z0-9+.-]+;base64,.{20,}$/i.test(v))d.company[f]='';
 });
 d.accounts.filter(function(a){return a.isMain;}).forEach(function(a){if(d.exp[a.id]===undefined)d.exp[a.id]=true;});
 // Backfill: any customer/supplier that does not have its OWN dedicated
 // sub-ledger account yet gets one auto-generated -- see
 // autoCreateContactAccount() above. A linked account only counts as
 // "already fine" when it (a) still exists and (b) is a genuine leaf
 // (no other account is nested under it) -- this also catches contacts
 // that were linked directly to a shared bucket/Main account (e.g. plain
 // "1103" / "2101" / "1103-01" / "2101-01") rather than to a personal
 // sub-account, which is exactly the "no account number shown" case.
 // Count how many contacts currently point at each linkedAccId, so that
 // two customers/suppliers sharing one generic bucket account (e.g. both
 // linked straight to "1103-01"/"2101-01") are BOTH recognized as not
 // having a personal account, regardless of processing order.
 var linkCount={};
 d.customers.concat(d.suppliers).forEach(function(c){
  if(c.linkedAccId)linkCount[c.linkedAccId]=(linkCount[c.linkedAccId]||0)+1;
 });
 function hasOwnLeafAcc(linkedId){
  if(!linkedId)return false;
  var acc=d.accounts.find(function(a){return a.id===linkedId;});
  if(!acc)return false;
  if(acc.isMain)return false;
  if(d.accounts.some(function(x){return x.pid===acc.id;}))return false;
  if((linkCount[linkedId]||0)>1)return false;
  return true;
 }
 d.customers.forEach(function(c){
  if(!hasOwnLeafAcc(c.linkedAccId)){var nid=autoCreateContactAccount(d.accounts,false,c);if(nid)c.linkedAccId=nid;}
 });
 d.suppliers.forEach(function(s){
  if(!hasOwnLeafAcc(s.linkedAccId)){var nid=autoCreateContactAccount(d.accounts,true,s);if(nid)s.linkedAccId=nid;}
 });
 return d;
}
// ── Multi-company support ────────────────────────────────────────────────
// A "registry" of companies (id+name) lives under COMP_REG_KEY; whichever
// one is currently open is remembered under ACTIVE_CO_KEY; and each
// company's own accounting data (accounts/journals/customers/invoices/...
// and its own branding in db.company) is stored under its own
// coStorageKey(id) — a separate localStorage entry per company, so
// switching never mixes data between companies.
// The one thing kept IDENTICAL across every company is db.users (logins,
// passwords, permissions): it's mirrored into USERS_KEY on every save()
// and re-applied onto whichever company db loads (applyGlobalUsers), so a
// single login works everywhere and a user added/edited under any company
// is instantly available under all the others too.
// This only governs the local-storage path; when HAS_CLOUD/fbRef is active
// the app still syncs a single shared company as before (unchanged).
var COMP_REG_KEY='ap7_companies';
var ACTIVE_CO_KEY='ap7_active_company';
var USERS_KEY='ap7_users_global';
function coStorageKey(id){return 'ap7_co_'+id;}
function getCompanyRegistry(){
 try{var s=localStorage.getItem(COMP_REG_KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))return a;}}catch(e){}
 return null;
}
function saveCompanyRegistry(list){try{localStorage.setItem(COMP_REG_KEY,JSON.stringify(list));}catch(e){}}
function getActiveCompanyId(){try{return localStorage.getItem(ACTIVE_CO_KEY)||'';}catch(e){return '';}}
function setActiveCompanyId(id){try{localStorage.setItem(ACTIVE_CO_KEY,id);}catch(e){}}
function getGlobalUsers(){
 try{var s=localStorage.getItem(USERS_KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a)&&a.length)return a;}}catch(e){}
 return null;
}
function saveGlobalUsers(users){try{if(users)localStorage.setItem(USERS_KEY,JSON.stringify(users));}catch(e){}}
function applyGlobalUsers(d){
 var gu=getGlobalUsers();
 if(gu)d.users=gu; else saveGlobalUsers(d.users);
 return d;
}
// Makes sure a company registry + active company exist, migrating any
// pre-multi-company data (the old single 'ap7' key) into "Company 1" the
// very first time this runs — so existing users never lose their data.
function ensureCompanySetup(){
 var reg=getCompanyRegistry();
 if(reg&&reg.length){
  if(!getActiveCompanyId())setActiveCompanyId(reg[0].id);
  return reg;
 }
 var id='co1',legacy=null;
 try{var s=localStorage.getItem('ap7');if(s)legacy=JSON.parse(s);}catch(e){}
 if(legacy&&Array.isArray(legacy.accounts)){
  try{localStorage.setItem(coStorageKey(id),JSON.stringify(legacy));}catch(e){}
  // Users are NOT seeded into the global store here on purpose: they still
  // need normalizeDB()'s healing (e.g. a missing admin passwordHash) first,
  // which loadFromLocalStorage()'s applyGlobalUsers() does right after this
  // returns. Saving the raw, unhealed copy here would permanently pin the
  // broken version into the global store.
  reg=[{id:id,name:(legacy.company&&legacy.company.name)||'Company 1'}];
 } else {
  reg=[{id:id,name:'Company 1'}];
 }
 saveCompanyRegistry(reg);
 setActiveCompanyId(id);
 return reg;
}
function loadFromLocalStorage(){
 ensureCompanySetup();
 var key=coStorageKey(getActiveCompanyId());
 try{
  var s=localStorage.getItem(key);
  if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.accounts))return applyGlobalUsers(normalizeDB(d));}
 }catch(e){try{localStorage.removeItem(key);}catch(e2){}}
 return applyGlobalUsers(normalizeDB(JSON.parse(JSON.stringify(DEF))));
}
function loadDB(){
 if(HAS_CLOUD&&fbRef){
  return fbRef.once('value').then(function(snap){
   var val=snap.val();
   if(val&&Array.isArray(val.accounts))return normalizeDB(val);
   return normalizeDB(JSON.parse(JSON.stringify(DEF)));
  }).catch(function(){
   return loadFromLocalStorage();
  });
 }
 return Promise.resolve(loadFromLocalStorage());
}

// anyway — WITHOUT auto-syncing/merging across devices (that risks a
// "last save wins" data loss if two devices are used at once) — each
// device silently creates (once) or reuses its own private, invisible
// Firebase account, and every save() pushes a one-way backup copy of the

// path shape and security rules as trainees — a uid can only touch its own

// Delegation-based on() - works with dynamically rendered elements
var _delegates=[];
function on(sel,evt,fn){
 // Only register once per sel+evt combo
 var key=sel+'|'+evt;
 if(_delegates.indexOf(key)===-1){
  _delegates.push(key);
  document.addEventListener(evt,function(e){
   var el=e.target.closest(sel);
   if(el)fn(el,e);
  },true);
 }
}
function on1(id,evt,fn){

 if(el)el.addEventListener(evt,fn);
 // Also store for modal re-render recovery

}
// Shared by the Company Stamp / Financial Manager Signature uploads in
// pSettings() — same resize-then-store-as-base64 approach as the existing
// Company Logo upload (on1('logoFile',...) below), just parameterized so it
// isn't copy-pasted a third time.
function wireImageUploadField(inputId,dbField,maxW,maxH){
 on1(inputId,'change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
   var img=new Image();
   img.onload=function(){
    var w=img.width,h=img.height;
    // Scale to FIT the maxW x maxH box, preserving aspect ratio -- in
    // EITHER direction. The original code only ever scaled a source image
    // DOWN when it exceeded the box; a small source (a tightly-cropped
    // stamp or signature photo, e.g. 40x30px) was stored at its own tiny
    // original size unchanged. That's what actually made stamps/signatures
    // look "missing": the real image WAS there, just a few pixels across
    // inside a much larger container everywhere it's displayed (Settings
    // preview, the Balance Confirmation Letter) -- easy to mistake for a
    // blank space or a rendering failure. Scaling up small sources too
    // (capped at a sane 8x so a truly tiny/low-quality source doesn't blow
    // up into an unusably blurry mess) keeps every upload a consistent,
    // clearly-visible size.
    var scale=Math.min(maxW/w,maxH/h,8);
    w=Math.max(1,Math.round(w*scale));
    h=Math.max(1,Math.round(h*scale));
    var canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    var ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    // Stamps/signatures are usually transparent-background PNGs meant to
    // overlay on a document — keep PNG whenever the source was PNG (or has
    // no reliable extension/type to judge by), only fall back to JPEG for
    // photos of a physical stamp/signature.
    var isPNG=file.type==='image/png'||file.name.toLowerCase().endsWith('.png')||!file.type;
    var compressed=isPNG?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',0.85);
    db.company[dbField]=compressed;

   };
   img.src=ev.target.result;
  };

}
// Retroactively fixes any stamp/signature that was already stored small
// (uploaded before the upscale-on-upload fix above existed) — re-uploading
// isn't the only way to end up with one; it can also arrive via a restored
// backup. Runs once at boot (see loadDB().then below); decoding an image
// is async, so this can't live inside normalizeDB(). Safe to call on every
// boot: an image already at a good size is left untouched (no save/render
// triggered), so this only ever does real work exactly once per image.
function upgradeSmallCompanyImages(){
 var fields=[['stamp',220,220],['signature',280,120]];
 var pending=fields.length,changed=false;
 function finish(){
  pending--;
  if(pending===0&&changed){save();render();}
 }
 fields.forEach(function(f){
  var key=f[0],maxW=f[1],maxH=f[2];
  var src=db.company[key];
  if(!src){finish();return;}
  var img=new Image();
  img.onload=function(){
   var w=img.width,h=img.height;
   var scale=Math.min(maxW/w,maxH/h,8);
   // Already a good size (or the source is too large to need help) --
   // nothing to do. The 1.15 margin avoids pointlessly re-encoding an
   // image that's already essentially at target size.
   if(scale<=1.15||w<1||h<1){finish();return;}
   var nw=Math.max(1,Math.round(w*scale)),nh=Math.max(1,Math.round(h*scale));
   var canvas=document.createElement('canvas');
   canvas.width=nw;canvas.height=nh;
   canvas.getContext('2d').drawImage(img,0,0,nw,nh);
   var isPNG=src.indexOf('data:image/png')===0;
   db.company[key]=isPNG?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',0.85);
   changed=true;
   finish();
  };
  img.onerror=function(){finish();};
  img.src=src;
 });
}

 if(!currentUser)return false;
 if(isAdmin())return true;
 var p=currentUser.perms&&currentUser.perms[mod];
 // If perms object is empty or missing — give full access (admin set no restrictions)
 if(!currentUser.perms||Object.keys(currentUser.perms).length===0)return true;

 if(action==='v')return !!(p.v||p.view||p[1]||p===true);
 if(action==='a')return !!(p.a||p.add||p===true);

}

 try{
  var s=JSON.parse(localStorage.getItem('ap_session')||'null');
  if(!s)return false;
  // Session valid for 7 days
  if(Date.now()-s.ts>7*24*60*60*1000){clearSession();return false;}

function importCoA(){
 if(!confirm('This will REPLACE the current Chart of Accounts with the bilingual IFRS chart (138 accounts). Your journals and transactions will be kept. Continue?')){return;}
 db.accounts = COA_IMPORT.map(function(a){
  return {
   id: a.id,
   name: a.name,
   nameAr: a.nameAr,
   type: a.type,
   normal: a.normal,
   bal: 0,
   isMain: a.isMain,
   pid: a.pid
  };
 });
 // Clean up undefined pid
 db.accounts.forEach(function(a){if(a.pid===undefined)delete a.pid;});
 save();
 render();
 alert('Chart of Accounts imported successfully! 138 accounts added.');
}

// ── Backup / Restore ────────────────────────────────────────────
// The accounting data (db: accounts, journals, invoices, customers,
// suppliers, receipts, payments, fixed assets, etc.) lives only in this
// browser's local storage (see save()/loadFromLocalStorage() above) — it is
// NOT synced to any server. That's deliberate (each trainee's practice data
// stays private to their own device instead of mixing with everyone else's
// on a shared cloud path), but it also means a device format, a browser
// switch, or clearing site data wipes it with no way to recover it. These
// two functions give the user a manual way to move that data to a file and
// back, independent of the device/browser it was created on.
function exportBackup(){
 var payload=JSON.stringify(db,null,2);
 var ts=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
 var fname='mizan-iq-backup-'+ts+'.json';
 // Prefer the File System Access API's native "Save As" dialog, so the user
 // can pick the drive/folder themselves (a plain <a download> instead always
 // saves straight to the browser's fixed default Downloads folder, with no
 // location prompt). Must be called synchronously from the click handler —
 // browsers only grant this while still inside the "user activation" of the
 // click that triggered it — which is exactly how exportBackup() is invoked
 // (see window.xAction / the data-action click delegate below).
 if(window.showSaveFilePicker){
  window.showSaveFilePicker({
   suggestedName:fname,
   types:[{description:'JSON Backup',accept:{'application/json':['.json']}}]
  }).then(function(handle){
   return handle.createWritable().then(function(writable){
    return writable.write(payload).then(function(){return writable.close();});
   });
  }).then(function(){
   markBackupDone();
  }).catch(function(err){
   if(err&&err.name==='AbortError')return; // user closed the Save-As dialog — do nothing
   exportBackupClassic(payload,fname); // picker failed for some other reason — fall back
  });
  return;
 }
 // Fallback for browsers without the File System Access API (Firefox,
 // Safari, older Chrome/Edge): a classic forced download. Where the user
 // can't pick a location this way, they can still get a Save-As prompt every
 // time by turning on their browser's "Ask where to save each file before
 // downloading" setting.
 exportBackupClassic(payload,fname);
}
function exportBackupClassic(payload,fname){
 var blob=new Blob([payload],{type:'application/json'});
 var url=URL.createObjectURL(blob);
 var a=document.createElement('a');
 a.href=url;
 a.download=fname;
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 setTimeout(function(){URL.revokeObjectURL(url);},1000);
 markBackupDone();
}
// Records the moment a backup actually went out (both save paths call this —
// see the writable.close().then() above for the File System Access path).
// Two things read this: the "Last backup" line on the Backup & Restore page,
// and the weekly reminder below, which uses it to avoid nagging again right
// after the user just backed up.
function markBackupDone(){
 try{
  var now=String(Date.now());
  localStorage.setItem('mizan_last_backup_at',now);

var LICENSE_DB_PATH='mizan_licenses';
// licenseState defined at top

// ── License key generation + offline verification ──────────────
// SECRET must be IDENTICAL to the copy in activate.html, or keys
// issued here won't verify there. Anyone who reads this source can
// find it — this stops casual/typed-in keys, not a determined reader.
var LICENSE_SALT='MzIQ-9Kf3-Secret-2026-XyQ';
function licStrHash(s){
 var h=0;
 for(var i=0;i<s.length;i++){h=(Math.imul(31,h)+s.charCodeAt(i))|0;}
 return h;
}
function licChecksum(partA,partB,expCode){
 var h=licStrHash(partA+'|'+partB+'|'+expCode+'|'+LICENSE_SALT);
 var s=Math.abs(h).toString(36).toUpperCase();
 while(s.length<6)s='0'+s;
 return s.slice(0,6);
}
// Used by the in-app "license expired / re-activate" screen (mirrors the
// checks in activate.html exactly, so a key rejected/accepted there behaves
// the same way here).
var KEY_PATTERN=/^MIZAN-[A-Z0-9]{4,8}-[A-Z0-9]{4,8}-[0-9]{8}-[A-Z0-9]{4,8}$/;
function isValidLicenseKey(k){
 var parts=k.split('-');
 if(parts.length!==5||parts[0]!=='MIZAN')return false;
 return licChecksum(parts[1],parts[2],parts[3])===parts[4];
}
function licExpiryFromKey(k){
 var expCode=k.split('-')[3];
 if(!expCode||expCode==='00000000')return '';
 return expCode.slice(0,4)+'-'+expCode.slice(4,6)+'-'+expCode.slice(6,8);
}
function sanitizeLicenseKey(v){
 return (v||'').toUpperCase().replace(/[‐-―−﹘﹣－]/g,'-').replace(/[^A-Z0-9-]/g,'');
}
function licRandSeg(len){
 var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid confusion when read aloud
 var s='';
 for(var i=0;i<len;i++)s+=chars.charAt(Math.floor(Math.random()*chars.length));
 return s;
}
// spec<=0 (or falsy '0') = lifetime key, encoded as '00000000'.
// Otherwise the expiry date is baked into the key as YYYYMMDD, and is
// part of the checksum input — a trainee can't edit the date without
// breaking the checksum.
// spec accepts: a plain number/numeric-string = months (back-compat),
// a string ending in 'm' = months (e.g. '12m'), or a string ending in
// 'd' = days (e.g. '15d').
function licExpCode(spec){
 var s=String(spec==null?'':spec).trim();
 if(!s||s==='0')return '00000000';
 var d=new Date();
 if(/d$/i.test(s)){
  var days=parseInt(s,10);
  if(!days||days<=0)return '00000000';
  d.setDate(d.getDate()+days);
 }else{
  var mo=parseInt(s,10);
  if(!mo||mo<=0)return '00000000';
  d.setMonth(d.getMonth()+mo);
 }
 var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
 return ''+y+m+day;
}
window.generateLicenseKey=function(seedA,seedB,months){
 var partA=licRandSeg(6),partB=licRandSeg(6);
 var expCode=licExpCode(months);
 var key='MIZAN-'+partA+'-'+partB+'-'+expCode+'-'+licChecksum(partA,partB,expCode);
 return {key:key,partA:partA,partB:partB,expCode:expCode};
};

  // firebaseManaged below) are re-checked live at every login and session

  // always-current check now, so a stale locally-cached expiry here (e.g.
  // right after the admin renews a license, which only updates the server)
  // must not block them from even reaching the login screen. Older,
  // purely-local accounts (activated before this migration) have no such

  if(!lic.firebaseManaged&&lic.expiry&&new Date(lic.expiry)<new Date()){

// Straight-Line depreciation per year
function calcAnnualDep(asset){
 var cost=asset.cost||0;
 var salvage=asset.salvageValue||0;
 var life=asset.usefulLife||1;
 return Math.round((cost-salvage)/life*100)/100;
}
// Accumulated depreciation up to a date
function calcAccDep(asset,toDate){
 // Use actual posted depreciation if available (from journal entries)
 var posted=asset.accDepreciation||0;
 // Also calculate theoretical based on time
 var annual=calcAnnualDep(asset);
 var startDate=new Date(asset.purchaseDate);
 var endDate=toDate?new Date(toDate):new Date(today());
 var months=(endDate.getFullYear()-startDate.getFullYear())*12+(endDate.getMonth()-startDate.getMonth());
 if(months<0)months=0;
 var years=months/12;
 var maxDep=(asset.cost||0)-(asset.salvageValue||0);
 var theoretical=Math.min(Math.round(annual*years*100)/100,maxDep);
 // Return the higher of posted or theoretical (posted takes precedence when > 0)
 return posted>0?posted:theoretical;
}
function bookValue(asset,toDate){
 return Math.max(0,(asset.cost||0)-calcAccDep(asset,toDate));
}

function nextPO(){return 'PO-'+String((db.purchaseOrders||[]).length+1).padStart(4,'0');}
function nextPI(){return 'PI-'+String((db.purchaseInvoices||[]).length+1).padStart(4,'0');}
function nextSI(){return 'SI-'+String((db.salesInvoices2||[]).length+1).padStart(4,'0');}
function nextItemId(){return 'IT-'+String((db.items||[]).length+1).padStart(3,'0');}
function itemById(id){return (db.items||[]).find(function(x){return x.id===id;});}
function receiveStock(itemId,qty,cost){
 var it=itemById(itemId);if(!it)return;
 var oldQty=it.qty||0;
 var oldVal=oldQty*(it.avgCost||0);
 var newVal=qty*(cost||0);
 var newQty=oldQty+qty;
 it.qty=newQty;
 it.avgCost=newQty>0?(oldVal+newVal)/newQty:(cost||0);
}
function issueStock(itemId,qty){
 var it=itemById(itemId);if(!it)return 0;
 var cost=it.avgCost||0;
 it.qty=Math.max(0,(it.qty||0)-qty);
 return cost;
}
function pItems(){
 var h=tb('Inventory Items','<button class="btn bp" data-action="addItem">'+ic('plus')+' New Item</button><button class="btn" data-action="xlsStock">'+ic('dn')+' Excel</button>');
 h+='<div class="pg">';
 // Recalculate all items from invoices
 (db.items||[]).forEach(function(it){
  var bq=0,ac=0;
  (db.purchaseInvoices||[]).forEach(function(pi){
   if(!pi.posted)return;
   pi.lines.forEach(function(l){
    if(l.itemId!==it.id)return;
    if(pi.type==='return'){bq=Math.max(0,bq-l.qty);}
    else{var ov=bq*ac;var nv=l.qty*(l.cost||0);bq+=l.qty;ac=bq>0?(ov+nv)/bq:l.cost||0;}
   });
  });
  (db.salesInvoices2||[]).forEach(function(si){
   if(!si.posted)return;
   si.lines.forEach(function(l){
    if(l.itemId!==it.id)return;
    if(si.type==='return')bq+=l.qty;else bq=Math.max(0,bq-l.qty);
   });
  });
  // Keep manual qty if no invoice data
  if(bq===0&&(it.qty||0)>0){/* keep existing qty */}else{it.qty=bq;it.avgCost=ac;}
 });

function pStockRpt(){
 var f=stockFrom,t=stockTo;
 var h=tb('Stock Report',
  '<button class="btn" data-action="xlsStockRpt">'+ic('dn')+' Excel</button>'
  +'<button class="btn" data-action="pdfStockRpt">'+ic('prt')+' PDF</button>');
 h+='<div class="pg">';
 // Filter bar
 h+='<div class="card" style="max-width:820px;margin-bottom:14px">'
  +'<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">'
  +'<div class="fl"><label>From</label><input type="date" id="stockFrom" value="'+f+'" style="padding:6px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:12px"></div>'
  +'<div class="fl"><label>To</label><input type="date" id="stockTo" value="'+t+'" style="padding:6px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:12px"></div>'
  +'<button class="btn bp" id="btnApplyStock">Apply</button>'
  +'<button class="btn" id="btnClearStock">Clear</button>'
  +'</div>'
  +((f||t)?'<div style="margin-top:8px;font-size:11px;color:var(--t2)">Period: '+(f||'All')+'  to  '+(t||'All')+'</div>':'')
  +'</div>';
 h+='<div class="card"><div class="tw"><table><thead><tr>'
  +'<th>Code</th><th>Item</th><th>Unit</th>'
  +'<th class="tr">Qty In</th><th class="tr">Qty Out</th><th class="tr">Balance</th>'
  +'<th class="tr">Avg Cost</th><th class="tr">Value</th>'
  +'</tr></thead><tbody>';
 var tIn=0,tOut=0,tVal=0;
 (db.items||[]).forEach(function(it){
  // Period movements (filtered by date)
  var qIn=0,qOut=0;
  (db.purchaseInvoices||[]).forEach(function(pi){
   if(!pi.posted)return;
   if(f&&pi.date<f)return;
   if(t&&pi.date>t)return;
   pi.lines.forEach(function(l){
    if(l.itemId!==it.id)return;
    if(pi.type==='return')qOut+=l.qty;else qIn+=l.qty;
   });
  });
  (db.salesInvoices2||[]).forEach(function(si){
   if(!si.posted)return;
   if(f&&si.date<f)return;
   if(t&&si.date>t)return;
   si.lines.forEach(function(l){
    if(l.itemId!==it.id)return;
    if(si.type==='return')qIn+=l.qty;else qOut+=l.qty;
   });
  });
  // Balance = recalculate from ALL posted invoices (WAVG)
  var balQty=0,avgC=0;
  (db.purchaseInvoices||[]).forEach(function(pi){
   if(!pi.posted)return;
   pi.lines.forEach(function(l){
    if(l.itemId!==it.id)return;
    if(pi.type==='return'){balQty=Math.max(0,balQty-l.qty);}
    else{
     var oldVal=balQty*avgC;
     var newVal=l.qty*(l.cost||0);
     balQty+=l.qty;
     avgC=balQty>0?(oldVal+newVal)/balQty:l.cost||0;
    }
   });
  });
  (db.salesInvoices2||[]).forEach(function(si){
   if(!si.posted)return;
   si.lines.forEach(function(l){
    if(l.itemId!==it.id)return;
    if(si.type==='return')balQty+=l.qty;
    else balQty=Math.max(0,balQty-l.qty);
   });
  });
  // Sync: if no posted invoices but item has qty, keep item's qty
  if(balQty===0&&(it.qty||0)>0){
   balQty=it.qty||0;
   avgC=it.avgCost||0;
  } else {
   it.qty=balQty;
   it.avgCost=avgC;
  }
  var val=balQty*avgC;
  tIn+=qIn;tOut+=qOut;tVal+=val;
  var low=it.reorderQty&&balQty<=it.reorderQty;
  var hasMove=qIn>0||qOut>0;
  if(!hasMove&&(f||t))return;
  h+='<tr>'
   +'<td><span class="tag">'+it.id+'</span></td>'
   +'<td style="font-weight:500">'+it.name+'</td>'
   +'<td style="font-size:12px;color:var(--t2)">'+( it.unit||'pcs')+'</td>'
   +'<td class="tr mn" style="color:var(--gn)">'+qIn.toFixed(2)+'</td>'
   +'<td class="tr mn" style="color:var(--rd)">'+qOut.toFixed(2)+'</td>'
   +'<td class="tr mn" style="font-weight:700;color:'+(low?'var(--rd)':'var(--gn)')+'">'+balQty.toFixed(2)+'</td>'
   +'<td class="tr mn">'+N(avgC)+'</td>'
   +'<td class="tr mn" style="font-weight:700">'+N(val)+'</td>'
   +'</tr>';
 });
 h+='<tr class="fin"><td colspan="3">Total</td>'
  +'<td class="tr mn">'+tIn.toFixed(2)+'</td>'
  +'<td class="tr mn">'+tOut.toFixed(2)+'</td>'
  +'<td></td><td></td>'
  +'<td class="tr mn">'+N(tVal)+'</td></tr>';
 h+='</tbody></table></div></div></div>';
 return h;
}

// ── ZATCA Invoice Print ──────────────────────────────────────
function buildZATCATLV(sellerName,vatNo,dateTime,totalWithVat,vatAmount){
 // Convert string to UTF-8 byte array
 function strToUtf8Bytes(str){
  var bytes=[];
  for(var i=0;i<str.length;i++){
   var c=str.charCodeAt(i);
   if(c<0x80)bytes.push(c);
   else if(c<0x800){bytes.push(0xC0|(c>>6));bytes.push(0x80|(c&0x3F));}
   else if(c<0x10000){bytes.push(0xE0|(c>>12));bytes.push(0x80|((c>>6)&0x3F));bytes.push(0x80|(c&0x3F));}
   else{bytes.push(0xF0|(c>>18));bytes.push(0x80|((c>>12)&0x3F));bytes.push(0x80|((c>>6)&0x3F));bytes.push(0x80|(c&0x3F));}
  }
  return bytes;
 }
 // Build TLV (Tag-Length-Value) field
 function tlvField(tag,str){
  var valBytes=strToUtf8Bytes(String(str));
  var result=[tag,valBytes.length].concat(valBytes);
  return result;
 }
 // Build all 5 ZATCA fields
 var allBytes=[]
  .concat(tlvField(1,sellerName))
  .concat(tlvField(2,vatNo))
  .concat(tlvField(3,dateTime))
  .concat(tlvField(4,totalWithVat.toFixed(2)))
  .concat(tlvField(5,vatAmount.toFixed(2)));
 // Convert byte array to base64 correctly
 var binary='';
 for(var i=0;i<allBytes.length;i++)binary+=String.fromCharCode(allBytes[i]);
 return btoa(binary);
}

// ── Global ZATCA QR Helper ───────────────────────────────────
function makeZATCAQR(sellerName,vatNo,dateStr,total,vat){
 var dt=dateStr.indexOf('T')>-1?dateStr:(dateStr+'T00:00:00Z');
 var b64=buildZATCATLV(sellerName,vatNo,dt,+total,+vat);
 // Module size 3 = small clean QR, readable by ZATCA app
 try{return QRJS.encode(b64,3);}catch(e){return '';}
}

// Universal AI call function
async function callAI(prompt,systemPrompt){
 if(!aiState.apiKey)throw new Error('No API Key configured');
 var isArLang=typeof lang!=='undefined'&&lang==='ar';
 var sys=systemPrompt||(isArLang?
  'أنت خبير محاسبي ومحلل مالي متخصص. يجب أن تكون جميع إجاباتك باللغة العربية الفصحى فقط. كن دقيقاً ومهنياً. استخدم المصطلحات المحاسبية العربية الصحيحة.':
  'You are an expert financial accountant and analyst. Respond entirely in English. Be precise and professional. Use standard accounting terminology.'
 );

 if(aiState.provider==='gemini'){
  var model=aiState.model||'gemini-1.5-flash';
  // Remove any extra spaces
  model=model.trim();
  var url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+aiState.apiKey;
  var body={contents:[{role:'user',parts:[{text:sys+'\n\n'+prompt}]}],generationConfig:{temperature:0.3,maxOutputTokens:4096}};
  var res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok){
   var errData=await res.json().catch(function(){return {};});
   throw new Error('Gemini API error: '+res.status+' — '+(errData&&errData.error&&errData.error.message||''));
  }
  var data=await res.json();
  if(!data.candidates||!data.candidates[0])throw new Error('No response from Gemini');
  return data.candidates[0].content.parts[0].text;

 } else if(aiState.provider==='claude'){
  var url2='https://api.anthropic.com/v1/messages';
  var body2={model:aiState.model||'claude-sonnet-4-6',max_tokens:4096,system:sys,messages:[{role:'user',content:prompt}]};
  var res2=await fetch(url2,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':aiState.apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify(body2)});
  if(!res2.ok)throw new Error('Claude API error: '+res2.status);
  var data2=await res2.json();
  return data2.content[0].text;

 } else if(aiState.provider==='openai'){
  var url3='https://api.openai.com/v1/chat/completions';
  var body3={model:aiState.model||'gpt-4o-mini',max_tokens:4096,messages:[{role:'system',content:sys},{role:'user',content:prompt}]};
  var res3=await fetch(url3,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+aiState.apiKey},body:JSON.stringify(body3)});
  if(!res3.ok)throw new Error('OpenAI API error: '+res3.status);
  var data3=await res3.json();
  return data3.choices[0].message.content;
 }
 throw new Error('Unknown provider');
}

var pageNums={journal:1,invoice:1,receipt:1,payment:1,purchases:1,sales2:1,po:1,coa:1};
var PAGE_SIZE=15;

function buildPager(total,current,pageKey){
 if(total<=PAGE_SIZE)return '';
 var totalPages=Math.ceil(total/PAGE_SIZE);
 var h='<div style="display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:center;flex-wrap:wrap">';
 // Prev
 h+='<button class="btn bsm" style="min-width:36px" '+(current<=1?'disabled':'data-page="'+(current-1)+'" data-pgkey="'+pageKey+'"')+'>‹</button>';
 // Page numbers
 for(var i=1;i<=totalPages;i++){
  if(i===1||i===totalPages||Math.abs(i-current)<=2){
   h+='<button class="btn bsm'+(i===current?' bp':'')+'" data-page="'+i+'" data-pgkey="'+pageKey+'" style="min-width:36px">'+i+'</button>';
  } else if(Math.abs(i-current)===3){
   h+='<span style="color:var(--t3);padding:0 4px">…</span>';
  }
 }
 // Next
 h+='<button class="btn bsm" style="min-width:36px" '+(current>=totalPages?'disabled':'data-page="'+(current+1)+'" data-pgkey="'+pageKey+'"')+'>›</button>';
 h+='<span style="font-size:12px;color:var(--t2);margin-right:8px">'+(lang==='ar'?'صفحة':'Page')+' '+current+' '+( lang==='ar'?'من':'of')+' '+totalPages+'</span>';
 return h+'</div>';
}

function pagerSlice(arr,pageKey){
 var pg=pageNums[pageKey]||1;
 var total=arr.length;
 var start=(pg-1)*PAGE_SIZE;
 return {items:arr.slice(start,start+PAGE_SIZE),total:total,current:pg,pageKey:pageKey};
}

// Get actual balance for a specific month (year-month)
function accBalMonth(accId, year, month){
 // month: 0-11
 var mm=String(month+1).padStart(2,'0');
 var from3=year+'-'+mm+'-01';
 // End of month
 var nextMm=month===11?'01':String(month+2).padStart(2,'0');
 var nextYr=month===11?year+1:year;
 var to3=nextYr+'-'+nextMm+'-01';
 // Use accBalRange with exclusive end date (just get the month's transactions)
 var a=db.accounts.find(function(x){return x.id===accId;});
 if(!a)return 0;
 var bal=0;
 db.journals.forEach(function(je){
  if(je.date<from3)return;
  if(je.date>=to3)return;
  (je.lines||[]).forEach(function(l){
   if(l.acc!==accId)return;
   if(a.type==='Revenue'||a.type==='Liability')bal+=(Number(l.cr)||0)-(Number(l.dr)||0);
   else bal+=(Number(l.dr)||0)-(Number(l.cr)||0);
  });
 });
 (db.receipts||[]).forEach(function(r){
  if(r.date<from3||r.date>=to3)return;
  if(r.accTo===accId)bal+=Number(r.amount)||0;
  if(r.accFrom===accId)bal-=Number(r.amount)||0;
 });
 (db.payments||[]).forEach(function(r){
  if(r.date<from3||r.date>=to3)return;
  if(r.accTo===accId)bal+=Number(r.amount)||0;
  if(r.accFrom===accId)bal-=Number(r.amount)||0;
 });
 return Math.abs(bal);
}

function accBalRange(accId,from2,to2){
 var a=db.accounts.find(function(x){return x.id===accId;});
 if(!a)return 0;
 // Always calculate from journal entries + opening balance
 var bal=a.bal||0; // opening balance
 db.journals.forEach(function(je){
  if(from2&&je.date<from2)return;
  if(to2&&je.date>to2)return;
  (je.lines||[]).forEach(function(l){
   if(l.acc!==accId)return;
   if(a.normal==='Debit')bal+=(Number(l.dr)||0)-(Number(l.cr)||0);
   else bal+=(Number(l.cr)||0)-(Number(l.dr)||0);
  });
 });
 // Also include receipts and payments
 (db.receipts||[]).forEach(function(r){
  if(from2&&r.date<from2)return;
  if(to2&&r.date>to2)return;
  if(r.accTo===accId){if(a.normal==='Debit')bal+=(Number(r.amount)||0);else bal-=(Number(r.amount)||0);}
  if(r.accFrom===accId){if(a.normal==='Debit')bal-=(Number(r.amount)||0);else bal+=(Number(r.amount)||0);}
 });
 (db.payments||[]).forEach(function(r){
  if(from2&&r.date<from2)return;
  if(to2&&r.date>to2)return;
  if(r.accTo===accId){if(a.normal==='Debit')bal+=(Number(r.amount)||0);else bal-=(Number(r.amount)||0);}
  if(r.accFrom===accId){if(a.normal==='Debit')bal-=(Number(r.amount)||0);else bal+=(Number(r.amount)||0);}
 });
 return bal;
}
function mainBalRange(mainId,from2,to2){
 var subs=db.accounts.filter(function(s){return s.pid===mainId;});
 if(!subs.length)return accBalRange(mainId,from2,to2);
 return subs.reduce(function(s,x){return s+accBalRange(x.id,from2,to2);},0);
}
// Like acctRollupBal() but date-range aware (for Trial Balance): an account
// with no children is computed directly from its postings via
// accBalRange(); a parent (e.g. "Local Customers" 1103-01, once individual
// customer sub-accounts exist under it -- see autoCreateContactAccount())
// sums its children's rolled-up balances instead, at any depth. This is
// what keeps Trial Balance totals correct once postings move from a
// 2-level sub-account onto its own auto-generated 3rd-level children.
function accBalRangeRollup(accId,from2,to2){
 var kids=db.accounts.filter(function(c){return c.pid===accId;});
 if(!kids.length)return accBalRange(accId,from2,to2);
 return kids.reduce(function(s,k){return s+accBalRangeRollup(k.id,from2,to2);},0);
}

function bsRows(mains,f,t){
 var sc=rptShowCodes;
 // Recursive: renders account + all descendants at any depth
 function renderAcc(acc,depth){
  var children=db.accounts.filter(function(c){return c.pid===acc.id;});
  var hasChildren=children.length>0;
  // Calculate balance: sum of leaf descendants
  function leafBal(a){
   var kids=db.accounts.filter(function(c){return c.pid===a.id;});
   if(!kids.length){
    var b=accBalRange(a.id,f,t);
    return a.normal==='Credit'&&a.type==='Asset'?-Math.abs(b):b;
   }
   return kids.reduce(function(s,k){return s+leafBal(k);},0);
  }
  var bal=leafBal(acc);
  if(Math.abs(bal)<0.001&&hasChildren){
   // Still render header if has children with balances
   var childrenHtml='';
   children.forEach(function(c){childrenHtml+=renderAcc(c,depth+1);});
   if(!childrenHtml)return '';
  }
  if(Math.abs(bal)<0.001&&!hasChildren)return '';

  var pad=depth*18;
  var padStyle='padding-inline-end:'+pad+'px';
  var code=sc?'<span class="tag" style="font-size:10px;margin-inline-end:4px">'+acc.id+'</span>':'';
  var nameHtml=depth===0?'<strong>'+code+accN(acc)+'</strong>':(code+'<span style="color:var(--t2)">'+accN(acc)+'</span>');
  if(depth>0&&!hasChildren){
   // Show Arabic name on next line if available
   var arName=acc.nameAr&&acc.nameAr!==acc.name?'<div style="font-size:10px;color:var(--t3);padding-inline-end:'+(pad+8)+'px">'+acc.nameAr+'</div>':'';
   var h='<div class="rr" style="'+padStyle+'">'+nameHtml+'<span class="mn">'+N(bal)+'</span></div>'+arName;
   return h;
  }
  // Header account (has children)
  var h='<div class="rr" style="'+padStyle+'">'+nameHtml+'<span class="mn">'+N(bal)+'</span></div>';
  children.forEach(function(c){h+=renderAcc(c,depth+1);});
  return h;
 }
 var h='';
 mains.forEach(function(m){h+=renderAcc(m,0);});
 return h;
}

 // Calculate all balances including sub-sub accounts
 function leafBal(type){
  // Recursive leaf balance - finds all leaf accounts of given type
  function getLeafBal(acc){

function agingData(ents,getItems){

   var amt=item.amount||item.items.reduce(function(s,i){return s+i.qty*i.rate*(1+i.vat/100);},0);
   if(days<=0)b[0]+=amt;else if(days<=30)b[1]+=amt;else if(days<=60)b[2]+=amt;else if(days<=90)b[3]+=amt;else b[4]+=amt;

 });

 return{rows:rows,tots:tots,grand:grand,bk:bk};
}

  });
  html+='<th colspan="3" style="text-align:center;padding:4px;background:#185FA510;border:1px solid var(--bd2);min-width:120px;font-weight:700">'+(isAr?'الإجمالي':'Total')+'</th></tr>';
  html+='<tr><th style="padding:3px 8px;background:var(--bg);border:1px solid var(--bd2)"></th>';
  for(var i=0;i<13;i++){
   html+='<th style="padding:3px 4px;background:var(--bg);border:1px solid var(--bd2);color:#185FA5;font-size:10px">'+(isAr?'م':'B')+'</th>';
   html+='<th style="padding:3px 4px;background:var(--bg);border:1px solid var(--bd2);color:'+color+';font-size:10px">'+(isAr?'ف':'A')+'</th>';
   if(i===12)html+='<th style="padding:3px 4px;background:var(--bg);border:1px solid var(--bd2);color:var(--t2);font-size:10px">'+(isAr?'ف±':'V±')+'</th>';
  }
  html+='</tr></thead><tbody>';

  var mBud=Array(12).fill(0),mAct=Array(12).fill(0);
  lines.forEach(function(l){
   var tBud=0,tAct=0;
   html+='<tr><td style="padding:5px 8px;border:1px solid var(--bd2);font-weight:500;white-space:nowrap;background:var(--sf)">'+(isAr&&l.nameAr?l.nameAr:l.name)+'</td>';
   for(var mi=0;mi<12;mi++){

   }
   // Total columns
   var vr=sectionType==='Revenue'?(tAct-tBud):(tBud-tAct);
   var pct2=tBud>0?Math.round(tAct/tBud*100):0;
   html+='<td class="tr mn" style="padding:4px 6px;border:1px solid var(--bd2);color:var(--t2)">'+N(tBud)+'</td>';
   html+='<td class="tr mn" style="padding:4px 6px;border:1px solid var(--bd2);color:'+color+';font-weight:700">'+N(tAct)+'</td>';
   html+='<td class="tr mn" style="padding:4px 6px;border:1px solid var(--bd2);font-weight:700;color:'+(vr>=0?'var(--gn)':'var(--rd)')+'">'+N(vr)+'<br><span style="font-size:10px;font-weight:400">'+pct2+'%</span></td>';
   html+='</tr>';
  });

  // Total row
  html+='<tr style="font-weight:700;background:var(--bg)"><td style="padding:6px 8px;border:1px solid var(--bd2)">'+(isAr?'الإجمالي':'Total')+'</td>';
  var gBud=0,gAct=0;
  for(var mi=0;mi<12;mi++){
   gBud+=mBud[mi];gAct+=mAct[mi];

  }
  var gVr=sectionType==='Revenue'?(gAct-gBud):(gBud-gAct);
  var gPct=gBud>0?Math.round(gAct/gBud*100):0;
  html+='<td class="tr mn" style="padding:5px 6px;border:1px solid var(--bd2)">'+N(gBud)+'</td>';

  html+='</tr></tbody></table>';
  html+='<div style="font-size:10px;color:var(--t2);margin-top:6px;padding:0 4px">'
   +(isAr?'م = مستهدف (الميزانية) | ف = فعلي (من دليل الحسابات) | ف± = الانحراف':'B = Budget Target | A = Actual (from Chart of Accounts) | V± = Variance')
   +'</div></div>';
  return html;
 }

 h+=buildCmpTable(allLines.filter(function(l){return l.type==='Revenue';}),'Revenue');
 h+=buildCmpTable(allLines.filter(function(l){return l.type==='Expense';}),'Expense');

function execCalc(){
 // Shared calculations for both dashboards
 var t=today();
 var yr=t.slice(0,4);
 var f=yr+'-01-01';
 function sumType(type,from,to){
  return db.accounts.filter(function(a){return a.type===type&&!a.isMain;})
   .reduce(function(s,a){return s+accBalRange(a.id,from||f,to||t);},0);
 }
 var rev=sumType('Revenue');
 var exp=sumType('Expense');
 var netIncome=rev-exp;
 var tAsset=sumType('Asset','','');
 var tLiab=sumType('Liability','','');
 var tEquity=sumType('Equity','','')+netIncome;
 // Gross profit (Revenue - COGS only)
 var cogs=db.accounts.filter(function(a){return a.type==='Expense'&&!a.isMain&&(a.name.indexOf('تكلفة')>-1||a.name.indexOf('بضاعة')>-1||a.name.toLowerCase().indexOf('cost')>-1||a.name.toLowerCase().indexOf('cogs')>-1);}).reduce(function(s,a){return s+accBalRange(a.id,f,t);},0);
 var grossProfit=rev-cogs;
 // Cash
 var cash=db.accounts.filter(function(a){return a.type==='Asset'&&!a.isMain&&(a.name.indexOf('نقد')>-1||a.name.indexOf('صندوق')>-1||a.name.indexOf('بنك')>-1||a.name.toLowerCase().indexOf('cash')>-1||a.name.toLowerCase().indexOf('bank')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);
 // Receivables
 var receivables=db.accounts.filter(function(a){return a.type==='Asset'&&!a.isMain&&(a.name.indexOf('عميل')>-1||a.name.indexOf('مدين')>-1||a.name.toLowerCase().indexOf('receiv')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);
 // Inventory
 var inventory=db.accounts.filter(function(a){return a.type==='Asset'&&!a.isMain&&(a.name.indexOf('مخزون')>-1||a.name.indexOf('بضاعة')>-1||a.name.toLowerCase().indexOf('inventor')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);
 var currentAssets=cash+receivables+inventory;
 var currentLiab=db.accounts.filter(function(a){return a.type==='Liability'&&!a.isMain&&(a.name.indexOf('قصير')>-1||a.name.indexOf('مورد')>-1||a.name.indexOf('دائن')>-1||a.name.toLowerCase().indexOf('current')>-1||a.name.toLowerCase().indexOf('payable')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);
 if(currentLiab===0)currentLiab=tLiab*0.6; // estimate
 // Sales invoices count & amount
 var siCount=(db.salesInvoices2||[]).filter(function(s){return s.date>=f&&s.date<=t&&s.type!=='return';}).length;
 var siTotal=(db.salesInvoices2||[]).filter(function(s){return s.date>=f&&s.date<=t&&s.type!=='return';}).reduce(function(s,x){return s+(x.total||0);},0);
 // Ratios
 var grossMargin=rev>0?grossProfit/rev*100:0;
 var netMargin=rev>0?netIncome/rev*100:0;
 var currentRatio=currentLiab>0?currentAssets/currentLiab:0;
 var debtToEquity=tEquity>0?tLiab/tEquity:0;
 var roe=tEquity>0?netIncome/tEquity*100:0;
 // Budget comparison (if any)
 var budgets=db.budgets||[];
 var latestBud=budgets.find(function(b){return b.year===parseInt(yr);});
 var budRev=latestBud?latestBud.lines.filter(function(l){return l.type==='Revenue';}).reduce(function(s,l){return s+(l.months||[]).reduce(function(a,v){return a+(+v||0);},0);},0):0;
 var budRevPct=budRev>0?Math.round(rev/budRev*100):null;
 return {rev:rev,exp:exp,netIncome:netIncome,grossProfit:grossProfit,grossMargin:grossMargin,netMargin:netMargin,tAsset:tAsset,tLiab:tLiab,tEquity:tEquity,cash:cash,receivables:receivables,inventory:inventory,currentAssets:currentAssets,currentLiab:currentLiab,currentRatio:currentRatio,debtToEquity:debtToEquity,roe:roe,siCount:siCount,siTotal:siTotal,budRev:budRev,budRevPct:budRevPct,yr:yr,asOf:t};
}

function kpiCard(title,value,sub,color,icon,extra){

  +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'

  +'</div>'
  +'<div style="font-size:22px;font-weight:800;color:'+color+';margin-bottom:4px;font-variant-numeric:tabular-nums">'+value+'</div>'

function pZakat(){
 var isAr=lang==='ar';
 var h=tb(isAr?'احتساب الزكاة':'Zakat Calculation',
  '<button class="btn" data-action="xlsZakat">'+ic('dn')+' Excel</button>'
  +'<button class="btn" data-action="pdfZakat">'+ic('prt')+' PDF</button>');
 h+='<div class="pg">';

 // Period filter
 h+='<div class="card" style="margin-bottom:14px">'
  +'<div class="ct">📅 '+(isAr?'سنة الزكاة':'Zakat Year')+'</div>'
  +'<div class="fr2">'
  +fld(isAr?'من تاريخ:':'From:','<input type="date" id="zk-from" value="'+(rptFrom||today().slice(0,4)+'-01-01')+'">')
  +fld(isAr?'إلى تاريخ:':'To:','<input type="date" id="zk-to" value="'+(rptTo||today())+'">')
  +'</div>'
  +'<button class="btn bp" id="btnCalcZakat" style="margin-top:8px">⚖️ '+(isAr?'احتساب الوعاء الزكوي':'Calculate Zakat Base')+'</button>'
  +'</div>';

 // Helper: get account balance by type
 var f=rptFrom||today().slice(0,4)+'-01-01';
 var t=rptTo||today();

 function sumType(type){
  return db.accounts.filter(function(a){return a.type===type&&!a.isMain;})
   .reduce(function(s,a){return s+accBalRange(a.id,'',t);},0);
 }
 function sumAccs(ids){
  return ids.reduce(function(s,id){
   return s+accBalRange(id,'',t);
  },0);
 }

 // ── ZATCA Zakat Base Calculation (Saudi Method) ────────────
 // الوعاء الزكوي = حقوق الملكية + الديون طويلة الأجل - الأصول الثابتة الصافية - الاستثمارات طويلة الأجل

 var totalEquity=sumType('Equity');
 var netIncome=(function(){
  var r=db.accounts.filter(function(a){return a.type==='Revenue'&&!a.isMain;}).reduce(function(s,a){return s+accBalRange(a.id,f,t);},0);
  var x=db.accounts.filter(function(a){return a.type==='Expense'&&!a.isMain;}).reduce(function(s,a){return s+accBalRange(a.id,f,t);},0);
  return r-x;
 })();

 // Assets breakdown
 var totalAssets=sumType('Asset');
 var totalLiab=sumType('Liability');

 // Fixed Assets (net of depreciation)
 var fixedAssetsNet=db.fixedAssets?db.fixedAssets.reduce(function(s,fa){
  var netVal=fa.cost-(fa.accumulated||0);
  return s+(netVal>0?netVal:0);
 },0):0;

 // Current Assets components
 var cash=db.accounts.filter(function(a){return a.type==='Asset'&&!a.isMain&&(a.name.toLowerCase().indexOf('cash')>-1||a.name.indexOf('نقد')>-1||a.name.indexOf('صندوق')>-1||a.name.indexOf('بنك')>-1||a.name.toLowerCase().indexOf('bank')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);

 var receivables=db.accounts.filter(function(a){return a.type==='Asset'&&!a.isMain&&(a.name.indexOf('عميل')>-1||a.name.indexOf('مدين')>-1||a.name.toLowerCase().indexOf('receiv')>-1||a.name.toLowerCase().indexOf('customer')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);

 var inventory=db.accounts.filter(function(a){return a.type==='Asset'&&!a.isMain&&(a.name.indexOf('مخزون')>-1||a.name.indexOf('بضاعة')>-1||a.name.toLowerCase().indexOf('inventor')>-1||a.name.toLowerCase().indexOf('stock')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);

 // Long-term liabilities
 var longTermLiab=db.accounts.filter(function(a){return a.type==='Liability'&&!a.isMain&&(a.name.indexOf('طويل')>-1||a.name.toLowerCase().indexOf('long')>-1||a.name.indexOf('قرض')>-1||a.name.toLowerCase().indexOf('loan')>-1);}).reduce(function(s,a){return s+Math.max(0,accBalRange(a.id,'',t));},0);

 // ZATCA Method: Zakat Base = (Equity + Long-term liabilities) - Fixed Assets - Long-term investments
 var zakatBase_method1 = (totalEquity+netIncome+longTermLiab) - fixedAssetsNet;
 if(zakatBase_method1<0)zakatBase_method1=0;

 // Alternative (Asset-based): Current Assets - Current Liabilities
 var currentLiab=totalLiab-longTermLiab;
 var currentAssets=totalAssets-fixedAssetsNet;
 var zakatBase_method2 = currentAssets-currentLiab;
 if(zakatBase_method2<0)zakatBase_method2=0;

 // Use method1 (ZATCA standard)
 var zakatBase = zakatBase_method1;

 // Zakat rate = 2.5% (ربع العشر)
 var zakatRate = 0.025;
 var zakatDue = zakatBase * zakatRate;

 // Nisab (threshold) — approx 85g gold × gold price (~230 SAR/g) = ~19,550 SAR
 var nisab = 19550;
 var aboveNisab = zakatBase >= nisab;

 // ── Display ──────────────────────────────────────────────────
 h+='<div class="card" style="margin-bottom:14px;border:2px solid #185FA510">'
  +'<div class="ct" style="color:#185FA5">📊 '+(isAr?'مكونات الوعاء الزكوي — طريقة هيئة الزكاة والضريبة':'Zakat Base Components — ZATCA Method')+'</div>'
  +'<div class="tw"><table><tbody>';

 function zkRow(label,val,indent,bold,color){
  return '<tr>'
   +'<td style="padding:8px 12px;'+(indent?'padding-right:28px;':'')+(bold?'font-weight:700;':'')+'border-bottom:1px solid var(--bd2)">'
   +(isAr?'':indent?'&nbsp;&nbsp;&nbsp;':'')+label+(isAr&&indent?'&nbsp;&nbsp;&nbsp;':'')
   +'</td>'
   +'<td class="tr mn" style="padding:8px 12px;border-bottom:1px solid var(--bd2);font-weight:'+(bold?'700':'400')+';color:'+(color||'var(--tx)')+'">'+N(val)+'</td>'
   +'</tr>';
 }

 h+=zkRow(isAr?'(+) إجمالي حقوق الملكية':'(+) Total Equity',totalEquity,false,false);
 h+=zkRow(isAr?'(+) صافي الدخل للفترة':'(+) Net Income for Period',netIncome,true,false,netIncome>=0?'var(--gn)':'var(--rd)');
 h+=zkRow(isAr?'(+) الديون طويلة الأجل':'(+) Long-term Liabilities',longTermLiab,false,false);
 h+=zkRow(isAr?'(-) الأصول الثابتة الصافية':'(-) Net Fixed Assets',-fixedAssetsNet,false,false,'var(--rd)');
 h+='<tr style="background:var(--bg)"><td style="padding:10px 12px;font-weight:700;font-size:13px">'
  +(isAr?'الوعاء الزكوي (الطريقة القياسية)':'Zakat Base (Standard Method)')
  +'</td><td class="tr mn" style="padding:10px 12px;font-weight:700;font-size:15px;color:#185FA5">'+N(zakatBase)+'</td></tr>';
 h+='</tbody></table></div></div>';

 // ── Current Assets Detail ────────────────────────────────────
 h+='<div class="card" style="margin-bottom:14px">'
  +'<div class="ct">🔍 '+(isAr?'تفصيل الأصول المتداولة':'Current Assets Detail')+'</div>'
  +'<div class="tw"><table><tbody>';
 h+=zkRow(isAr?'النقدية والبنوك':'Cash & Banks',cash,false);
 h+=zkRow(isAr?'الذمم المدينة (العملاء)':'Accounts Receivable',receivables,false);
 h+=zkRow(isAr?'المخزون':'Inventory',inventory,false);
 var otherCurrentAssets=currentAssets-cash-receivables-inventory;
 if(Math.abs(otherCurrentAssets)>0.01)h+=zkRow(isAr?'أصول متداولة أخرى':'Other Current Assets',otherCurrentAssets,false);
 h+='<tr style="background:var(--bg)"><td style="padding:8px 12px;font-weight:700">'+(isAr?'إجمالي الأصول المتداولة':'Total Current Assets')+'</td><td class="tr mn" style="padding:8px 12px;font-weight:700">'+N(currentAssets)+'</td></tr>';
 h+='</tbody></table></div></div>';

 // ── Zakat Due ─────────────────────────────────────────────────
 var dueColor=aboveNisab?'#0F6E56':'#B45309';
 h+='<div class="card" style="border:2px solid '+(aboveNisab?'#0F6E56':'#B45309')+'">'
  +'<div class="ct" style="color:'+dueColor+'">⚖️ '+(isAr?'نتيجة احتساب الزكاة':'Zakat Calculation Result')+'</div>'
  +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px">'
  +'<div class="met"><div class="mlab">'+(isAr?'الوعاء الزكوي':'Zakat Base')+'</div><div class="mv mn">'+N(zakatBase)+'</div></div>'
  +'<div class="met"><div class="mlab">'+(isAr?'نصاب الزكاة':'Nisab Threshold')+'</div><div class="mv mn">'+N(nisab)+'</div></div>'
  +'<div class="met"><div class="mlab">'+(isAr?'زكاة مستحقة (2.5%)':'Zakat Due (2.5%)')+'</div><div class="mv mn" style="color:'+dueColor+';font-size:20px">'+N(zakatDue)+'</div></div>'
  +'</div>'

  // Status
  +'<div style="padding:14px;border-radius:var(--r);background:'+(aboveNisab?'#E1F5EE':'#FFF7E0')+';display:flex;align-items:center;gap:14px">'
  +'<div style="font-size:36px">'+(aboveNisab?'✅':'⚠️')+'</div>'
  +'<div>'
  +'<div style="font-weight:700;font-size:15px;color:'+dueColor+'">'
  +(aboveNisab
    ?(isAr?'الوعاء يتجاوز النصاب — الزكاة واجبة':'Zakat Base exceeds Nisab — Zakat is due')
    :(isAr?'الوعاء أقل من النصاب — لا زكاة واجبة':'Zakat Base below Nisab — No Zakat due'))
  +'</div>'
  +'<div style="font-size:12px;color:var(--t2);margin-top:4px">'
  +(isAr
    ?'نسبة الزكاة: ربع العشر (2.5%) | النصاب المرجعي: قيمة 85 جرام ذهب ≈ '+N(nisab)+' ر.س'
    :'Zakat Rate: 2.5% (Quarter of tenth) | Nisab: Value of 85g gold ≈ SAR '+N(nisab))
  +'</div>'
  +'</div></div>'

  // Lunar year note
  +'<div style="margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:var(--r);font-size:11px;color:var(--t2);line-height:1.7">'
  +'<strong>'+(isAr?'ملاحظات مهمة:':'Important Notes:')+'</strong><br>'
  +(isAr
    ?'• يُحتسب الوعاء الزكوي وفق معايير هيئة الزكاة والضريبة والجمارك (زاتكا)<br>• النصاب يُحسب بقيمة 85 جرام ذهب بالسعر السائد<br>• الزكاة تُحسب على أساس الحول الهجري (354 يوم)<br>• يُنصح بمراجعة مستشار ضريبي معتمد قبل تقديم الإقرار'
    :'• Zakat base calculated per ZATCA (Saudi Zakat Authority) guidelines<br>• Nisab based on current gold price for 85 grams<br>• Zakat is calculated on Hijri year basis (354 days)<br>• Consult a certified tax advisor before filing')
  +'</div></div>';

 h+='</div>';
 return h;
}

    +'<div style="font-size:12px;color:var(--t2)">'+(isAr?'مقارنة الميزانية التقديرية مع الفعلي — شهرياً':'Monthly Budget vs Actual — Linked to Chart of Accounts')+'</div></div>'

    +'</div></div></div>';

   // ── Summary KPI cards ──────────────────────────────────
   var totBudRev=allLines2.filter(function(l){return l.type==='Revenue';}).reduce(function(s,l){return s+(l.months||[]).reduce(function(a,v){return a+(+v||0);},0);},0);
   var totBudExp=allLines2.filter(function(l){return l.type==='Expense';}).reduce(function(s,l){return s+(l.months||[]).reduce(function(a,v){return a+(+v||0);},0);},0);
   var totActRev=allLines2.filter(function(l){return l.type==='Revenue';}).reduce(function(s,l){
    return s+(l.months||[]).reduce(function(a,v,mi){return a+accBalMonth(l.accId,yr,mi);},0);
   },0);
   var totActExp=allLines2.filter(function(l){return l.type==='Expense';}).reduce(function(s,l){
    return s+(l.months||[]).reduce(function(a,v,mi){return a+accBalMonth(l.accId,yr,mi);},0);
   },0);

   h+='<div class="mets">'
    +'<div class="met"><div class="mlab">'+(isAr?'إيرادات متوقعة':'Budget Revenue')+'</div><div class="mv mn">'+N(totBudRev)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'إيرادات فعلية':'Actual Revenue')+'</div><div class="mv mn pos">'+N(totActRev)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'انحراف الإيرادات':'Revenue Variance')+'</div><div class="mv mn" style="color:'+((totActRev-totBudRev)>=0?'var(--gn)':'var(--rd)')+'">'+N(totActRev-totBudRev)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'مصاريف متوقعة':'Budget Expenses')+'</div><div class="mv mn">'+N(totBudExp)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'مصاريف فعلية':'Actual Expenses')+'</div><div class="mv mn neg">'+N(totActExp)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'صافي فعلي':'Actual Net')+'</div><div class="mv mn" style="color:'+((totActRev-totActExp)>=0?'var(--gn)':'var(--rd)')+'">'+N(totActRev-totActExp)+'</div></div>'
    +'</div>';

   // ── Monthly comparison per section ─────────────────────
   function buildCompareSection(lines2,sectionType){
    var color=sectionType==='Revenue'?'#0F6E56':'#b91c1c';
    var icon=sectionType==='Revenue'?'📈':'📉';
    var label=sectionType==='Revenue'?(isAr?'الإيرادات':'Revenue'):(isAr?'المصاريف':'Expenses');
    var html='<div class="card" style="margin-bottom:14px">'
     +'<div class="ct" style="color:'+color+'">'+icon+' '+label+'</div>'
     +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><thead>'
     // Header row 1: Account + months
     +'<tr>'
     +'<th rowspan="2" style="min-width:140px;padding:6px 8px;background:var(--bg);border:1px solid var(--bd2);text-align:right">'+(isAr?'الحساب':'Account')+'</th>';
    months2.forEach(function(m){
     html+='<th colspan="3" style="text-align:center;padding:4px;background:var(--bg);border:1px solid var(--bd2);color:'+color+'">'+m+'</th>';
    });
    html+='<th colspan="3" style="text-align:center;padding:4px;background:#185FA510;border:1px solid var(--bd2);font-weight:700">'+(isAr?'الإجمالي':'Total')+'</th>';
    html+='</tr><tr>';
    // Header row 2: B/A/V for each month
    var shortB=isAr?'م':'B',shortA=isAr?'ف':'A',shortV=isAr?'ف±':'V±';
    for(var mi=0;mi<13;mi++){
     html+='<th style="padding:3px 4px;background:var(--bg);border:1px solid var(--bd2);font-size:10px;color:#185FA5">'+shortB+'</th>';
     html+='<th style="padding:3px 4px;background:var(--bg);border:1px solid var(--bd2);font-size:10px;color:'+color+'">'+shortA+'</th>';
     html+='<th style="padding:3px 4px;background:var(--bg);border:1px solid var(--bd2);font-size:10px;color:var(--t2)">'+shortV+'</th>';
    }
    html+='</tr></thead><tbody>';

    // Month totals
    var mBudTot=Array(12).fill(0),mActTot=Array(12).fill(0);

    lines2.forEach(function(l){
     var accBudTotal=0,accActTotal=0;
     html+='<tr><td style="padding:5px 8px;border:1px solid var(--bd2);font-weight:500;background:var(--sf)">'
      +(isAr&&l.nameAr?l.nameAr:l.name)+'</td>';
     for(var mi=0;mi<12;mi++){
      var bv=+(l.months[mi])||0;
      var av=accBalMonth(l.accId,yr,mi);
      var vr=sectionType==='Revenue'?(av-bv):(bv-av);
      mBudTot[mi]+=bv;mActTot[mi]+=av;
      accBudTotal+=bv;accActTotal+=av;
      html+='<td class="tr" style="padding:3px 5px;border:1px solid var(--bd2);font-size:11px">'+( bv?N(bv):'—')+'</td>';
      html+='<td class="tr" style="padding:3px 5px;border:1px solid var(--bd2);font-size:11px;color:'+color+'">'+( av?N(av):'—')+'</td>';
      html+='<td class="tr" style="padding:3px 5px;border:1px solid var(--bd2);font-size:11px;font-weight:600;color:'+(vr>0?'var(--gn)':vr<0?'var(--rd)':'var(--t3)')+'">'+( vr?N(vr):'—')+'</td>';
     }
     // Row totals
     var rowVr=sectionType==='Revenue'?(accActTotal-accBudTotal):(accBudTotal-accActTotal);
     var pct=accBudTotal>0?Math.round(accActTotal/accBudTotal*100):0;
     html+='<td class="tr mn" style="padding:4px 6px;border:1px solid var(--bd2);background:#185FA508">'+N(accBudTotal)+'</td>';
     html+='<td class="tr mn" style="padding:4px 6px;border:1px solid var(--bd2);background:#185FA508;color:'+color+'">'+N(accActTotal)+'</td>';
     html+='<td class="tr mn" style="padding:4px 6px;border:1px solid var(--bd2);background:#185FA508;font-weight:700;color:'+(rowVr>=0?'var(--gn)':'var(--rd)')+'">'+N(rowVr)+' ('+pct+'%)</td>';
     html+='</tr>';
    });

    // Totals row
    html+='<tr style="font-weight:700;background:var(--bg)"><td style="padding:6px 8px;border:1px solid var(--bd2)">'+(isAr?'الإجمالي':'Total')+'</td>';
    var grandBud=0,grandAct=0;
    for(var mi=0;mi<12;mi++){
     var vr2=sectionType==='Revenue'?(mActTot[mi]-mBudTot[mi]):(mBudTot[mi]-mActTot[mi]);
     grandBud+=mBudTot[mi];grandAct+=mActTot[mi];
     html+='<td class="tr mn" style="padding:4px 5px;border:1px solid var(--bd2)">'+( mBudTot[mi]?N(mBudTot[mi]):'—')+'</td>';
     html+='<td class="tr mn" style="padding:4px 5px;border:1px solid var(--bd2);color:'+color+'">'+( mActTot[mi]?N(mActTot[mi]):'—')+'</td>';
     html+='<td class="tr mn" style="padding:4px 5px;border:1px solid var(--bd2);color:'+(vr2>=0?'var(--gn)':'var(--rd)')+'">'+( vr2?N(vr2):'—')+'</td>';
    }
    var grandVr=sectionType==='Revenue'?(grandAct-grandBud):(grandBud-grandAct);
    var grandPct=grandBud>0?Math.round(grandAct/grandBud*100):0;
    html+='<td class="tr mn" style="padding:5px 6px;border:1px solid var(--bd2);color:#185FA5;font-size:13px">'+N(grandBud)+'</td>';
    html+='<td class="tr mn" style="padding:5px 6px;border:1px solid var(--bd2);color:'+color+';font-size:13px">'+N(grandAct)+'</td>';
    html+='<td class="tr mn" style="padding:5px 6px;border:1px solid var(--bd2);font-size:13px;color:'+(grandVr>=0?'var(--gn)':'var(--rd)')+'">'+N(grandVr)+' ('+grandPct+'%)</td>';
    html+='</tr></tbody></table></div>'
     +'<div style="font-size:11px;color:var(--t2);margin-top:6px">'
     +(isAr?'م = متوقع | ف = فعلي (من دليل الحسابات) | ف± = الانحراف':'B = Budget | A = Actual (from Chart of Accounts) | V± = Variance')
     +'</div></div>';
    return html;
   }

   h+=buildCompareSection(allLines2.filter(function(l){return l.type==='Revenue';}),'Revenue');
   h+=buildCompareSection(allLines2.filter(function(l){return l.type==='Expense';}),'Expense');

   // Net income comparison
   var netBud2=totBudRev-totBudExp,netAct2=totActRev-totActExp;
   h+='<div class="card">'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">'
    +'<div class="met"><div class="mlab">'+(isAr?'صافي متوقع':'Budget Net')+'</div><div class="mv mn">'+N(netBud2)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'صافي فعلي':'Actual Net')+'</div><div class="mv mn" style="color:'+(netAct2>=0?'var(--gn)':'var(--rd)')+'">'+N(netAct2)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'الانحراف':'Variance')+'</div><div class="mv mn" style="color:'+((netAct2-netBud2)>=0?'var(--gn)':'var(--rd)')+'">'+N(netAct2-netBud2)+'</div></div>'
    +'<div class="met"><div class="mlab">'+(isAr?'نسبة الإنجاز':'Achievement')+'</div><div class="mv" style="color:'+(netBud2>0?(netAct2/netBud2*100>=100?'var(--gn)':'var(--rd)'):'var(--t2)')+'">'+( netBud2!==0?Math.round(netAct2/netBud2*100)+'%':'—')+'</div></div>'
    +'</div></div>';
  }
 }

 return h+'</div>';
}

 db.costCenters.forEach(function(c){ccData[c.id]={name:c.name,nameAr:c.nameAr||'',exp:0,rev:0,lines:[]};});
 db.journals.forEach(function(je){
  je.lines.forEach(function(l){
   if(!l.cc)return;
   var a=db.accounts.find(function(x){return x.id===l.acc;});
   if(!a)return;
   if(!ccData[l.cc])return;
   var amt=l.dr>0?l.dr:l.cr;
   if(a.type==='Expense'&&l.dr>0)ccData[l.cc].exp+=l.dr;
   if(a.type==='Revenue'&&l.cr>0)ccData[l.cc].rev+=l.cr;
   ccData[l.cc].lines.push({date:je.date,ref:je.id,desc:je.desc,acc:l.acc,accName:a.name,dr:l.dr,cr:l.cr});
  });
 });
 // Summary cards
 h+='<div class="mets">';
 db.costCenters.filter(function(c){return c.active;}).forEach(function(c){
  var d=ccData[c.id]||{exp:0,rev:0};
  var net=d.rev-d.exp;
  h+='<div class="met"><div class="mlab">'+c.name+'</div>';
  h+='<div style="font-size:11px;color:var(--t2);margin-bottom:3px">Rev: '+N(d.rev)+' | Exp: '+N(d.exp)+'</div>';
  h+='<div class="mv '+(net>=0?'pos':'neg')+'">'+N(net)+'</div></div>';
 });
 h+='</div>';
 // Detail per CC
 db.costCenters.filter(function(c){return c.active;}).forEach(function(c){
  var d=ccData[c.id]||{exp:0,rev:0,lines:[]};
  if(!d.lines.length)return;
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  h+='<div><div style="font-weight:700;font-size:14px">'+c.name+'</div>';
  if(c.nameAr)h+='<div style="font-size:12px;color:var(--t2)" dir="rtl">'+c.nameAr+'</div></div>';
  h+='<div style="display:flex;gap:14px"><div style="text-align:center"><div style="font-size:10px;color:var(--t3)">Revenue</div><div style="font-weight:700;color:var(--gn)">'+N(d.rev)+'</div></div>';
  h+='<div style="text-align:center"><div style="font-size:10px;color:var(--t3)">Expenses</div><div style="font-weight:700;color:var(--rd)">'+N(d.exp)+'</div></div>';
  h+='<div style="text-align:center"><div style="font-size:10px;color:var(--t3)">Net</div><div style="font-weight:700;color:'+(d.rev-d.exp>=0?'var(--gn)':'var(--rd)')+'">'+N(d.rev-d.exp)+'</div></div></div></div>';
  h+='<div class="tw"><table><thead><tr><th>Date</th><th>Ref</th><th>Description</th><th>Account</th><th class="tr">Debit</th><th class="tr">Credit</th></tr></thead><tbody>';
  d.lines.forEach(function(l){
   h+='<tr><td>'+l.date+'</td><td><span class="tag">'+l.ref+'</span></td><td>'+l.desc+'</td>';
   h+='<td><span class="tag" style="margin-right:4px">'+l.acc+'</span>'+l.accName+'</td>';
   h+='<td class="tr mn" style="color:'+(l.dr?'var(--bl)':'var(--t3)')+'">'+( l.dr?N(l.dr):'')+'</td>';
   h+='<td class="tr mn" style="color:'+(l.cr?'var(--gn)':'var(--t3)')+'">'+( l.cr?N(l.cr):'')+'</td></tr>';
  });
  h+='<tr style="background:var(--bg);font-weight:700"><td colspan="4">Total</td>';
  h+='<td class="tr mn" style="color:var(--rd)">'+N(d.exp)+'</td><td class="tr mn" style="color:var(--gn)">'+N(d.rev)+'</td></tr>';
  h+='</tbody></table></div></div>';
 });
 if(db.costCenters.every(function(c){return !(ccData[c.id]&&ccData[c.id].lines.length);})){
  h+='<div class="hint">No cost center data yet. When entering journal entries, select a cost center for expense and revenue lines.</div>';
 }
 return h+'</div>';
}

function mAcc(){

 var subsNoJE=db.accounts.filter(function(x){
  if(x.isMain)return false;
  var usedJ=db.journals.some(function(j){return j.lines&&j.lines.some(function(l){return l.acc===x.id;});});
  var usedR=(db.receipts||[]).some(function(r){return r.accTo===x.id||r.accFrom===x.id;});
  var usedP=(db.payments||[]).some(function(r){return r.accTo===x.id||r.accFrom===x.id;});
  return !usedJ&&!usedR&&!usedP;
 });

 // Check if current account (edit mode) has no entries → can be promoted
 var canPromote=false;
 if(a.editId&&isSub){
  var usedJ=db.journals.some(function(j){return j.lines&&j.lines.some(function(l){return l.acc===a.editId;});});
  var usedR=(db.receipts||[]).some(function(r){return r.accTo===a.editId||r.accFrom===a.editId;});

 }

 var body='';

 // Show promote option when editing a sub-account with no entries
 if(a.editId&&isSub&&canPromote){

 if(!a.isMain&&!a.promote){

  body+=fld('Parent Account *','<select id="a-par">'+parOpts+'</select>');

 body+='<div class="fr2">'+fld('Code *','<input id="a-id" value="'+(a.id||'')+'" placeholder="'+(isSub?'1001':'1000')+'">')+fld('Name (EN) *','<input id="a-name" value="'+(a.name||'')+'" placeholder="e.g. Cash Custody">')+fld('Name (AR)','<input id="a-namear" value="'+(a.nameAr||'')+'" dir="rtl" placeholder="مثال: عهدة نقدية">')+'</div>';
