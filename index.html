 // VAT auto-calculation
 on('.jeVAT','change',function(el){
  var i=Number(el.dataset.i);
  var vatRate=Number(el.value)||0;
  tJE.lines[i].vat=vatRate||undefined;
  if(!vatRate){render();return;}

  // ── VAT Account Logic ──────────────────────────────────────
  // Expense (DR line)  → VAT Input Tax  → DEBIT  (recoverable/reclaimable)
  // Revenue (CR line)  → VAT Payable    → CREDIT (collected from customer)
  var drVal=Number(tJE.lines[i].dr)||0;
  var crVal=Number(tJE.lines[i].cr)||0;
  var baseAmt=drVal||crVal;
  if(!baseAmt){render();return;}

  var vatAmt=Math.round(baseAmt*vatRate/100*100)/100;

  var isExpense=drVal>0;  // Debit line = expense = VAT Input
  var isRevenue=crVal>0;  // Credit line = revenue = VAT Output/Payable

  // Find appropriate VAT account
  var vatAccId;
  if(isExpense){
   // VAT Input Tax — look for VAT receivable/input account, fallback to VAT Payable
   var vatInputAcc=db.accounts.find(function(a){
    var n=a.name.toLowerCase();
    return n.indexOf('vat input')!==-1||n.indexOf('vat receivable')!==-1||n.indexOf('vat refundable')!==-1;
   });
   vatAccId=vatInputAcc?vatInputAcc.id:'2002'; // fallback: reduce VAT Payable
  } else {
   // VAT Output / Payable — collected from customer
   var vatPayableAcc=db.accounts.find(function(a){
    var n=a.name.toLowerCase();
    return n.indexOf('vat payable')!==-1||n.indexOf('vat output')!==-1||(n.indexOf('vat')!==-1&&a.type==='Liability');
   });
   vatAccId=vatPayableAcc?vatPayableAcc.id:'2002';
  }

  // Remove any existing VAT lines for this index
  tJE.lines=tJE.lines.filter(function(l){return !l.isVatLine||l.vatFor!==i;});

  // Add VAT line with CORRECT debit/credit
  var vatLine={acc:vatAccId,dr:0,cr:0,isVatLine:true,vatFor:i};
  if(isExpense){
   vatLine.dr=vatAmt;  // Expense → VAT Input DEBIT (company pays VAT)
  } else {
   vatLine.cr=vatAmt;  // Revenue → VAT Payable CREDIT (company collects VAT)
  }
  tJE.lines.push(vatLine);

  render();
  // Restore focus
  setTimeout(function(){jeHint();},50);
 });

  } else {
   if(!pwd||pwd.length<6){alert('Password must be at least 6 characters.');return;}
   var exists=(db.users||[]).find(function(x){return x.username===uname;});
   if(exists){alert('Username already exists.');return;}
   db.users=db.users||[];
   db.users.push({id:'u'+Date.now(),username:uname,name:name,role:role,passwordHash:hashPwd(pwd),active:true,perms:perms});
  }
  modal=null;save();render();

 on('.itAccSearch','input',function(el){
  var q=el.value.toLowerCase().trim();
  var drop=document.getElementById(el.id+'-drop');
  var sel=document.getElementById(el.id+'-sel');
  if(!drop)return;
  drop.style.display='block';
  if(sel){
   // Filter options by code OR name (EN or AR)
   var opts=sel.querySelectorAll('option');
   var first=null;
   opts.forEach(function(o){
    var code=(o.dataset.code||o.value||'').toLowerCase();
    var ar=(o.dataset.ar||'').toLowerCase();
    var label=o.text.toLowerCase();
    var match=!q||code.indexOf(q)!==-1||label.indexOf(q)!==-1||ar.indexOf(q)!==-1;
    o.style.display=match?'':'none';
    if(match&&!first)first=o;
   });
  }
 });

 });

  var sel=document.getElementById(el.id+'-sel');

  if(e.key==='Enter'){
   e.preventDefault();
   var opts=Array.from(sel.querySelectorAll('option')).filter(function(o){return o.style.display!=='none';});

 on1('logoFile','change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
   var img=new Image();
   img.onload=function(){
    // Resize to max 300x120 to keep base64 small for Firebase
    var maxW=300,maxH=120;
    var w=img.width,h=img.height;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
    var canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    var ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    // Use PNG for logos with transparency, JPEG otherwise
    var isPNG=file.type==='image/png'||file.name.toLowerCase().endsWith('.png');
    var compressed=isPNG?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',0.75);
    var kb=Math.round(compressed.length*0.75/1024);
    db.company.logo=compressed;
    save();render();
    console.log('Logo saved: '+w+'x'+h+'px, ~'+kb+'KB base64');
   };
   img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
 });

 on1('btnCloseFY','click',function(){
  var retainedAccId=(document.getElementById('fy-retained')||{}).value||'';
  if(!retainedAccId){alert(lang==='ar'?'\u0627\u062e\u062a\u0631 \u062d\u0633\u0627\u0628 \u0627\u0644\u0623\u0631\u0628\u0627\u062d \u0627\u0644\u0645\u062a\u0631\u0627\u0643\u0645\u0629':'Select Retained Earnings Account');return;}
  var activeFY2=(db.fiscalYears||[]).find(function(y){return y.status==='open';});
  if(!activeFY2){alert(lang==='ar'?'\u0644\u0627 \u062a\u0648\u062c\u062f \u0633\u0646\u0629 \u0645\u0627\u0644\u064a\u0629 \u0645\u0641\u062a\u0648\u062d\u0629':'No open fiscal year');return;}
  if(!confirm(lang==='ar'?'\u0625\u063a\u0644\u0627\u0642 \u0627\u0644\u0633\u0646\u0629 \u0627\u0644\u0645\u0627\u0644\u064a\u0629 '+activeFY2.year+'?':'Close fiscal year '+activeFY2.year+'?'))return;

  var rev2=db.accounts.filter(function(a){return a.type==='Revenue'&&!a.isMain;}).reduce(function(s,a){return s+accBalRange(a.id,activeFY2.from,activeFY2.to);},0);
  var exp2=db.accounts.filter(function(a){return a.type==='Expense'&&!a.isMain;}).reduce(function(s,a){return s+accBalRange(a.id,activeFY2.from,activeFY2.to);},0);
  var netIncome2=rev2-exp2;

  // Closing JE - close revenue and expense accounts
  var closeJE2={id:'JE-CLOSE-'+activeFY2.year,date:activeFY2.to,
   desc:(lang==='ar'?'\u0642\u064a\u062f \u0625\u063a\u0644\u0627\u0642 \u0627\u0644\u0633\u0646\u0629 \u0627\u0644\u0645\u0627\u0644\u064a\u0629 ':'Year-End Closing ')+activeFY2.year,
   lines:[],isClosing:true,fy:activeFY2.year};

  db.accounts.filter(function(a){return a.type==='Revenue'&&!a.isMain;}).forEach(function(a){
   var b=accBalRange(a.id,activeFY2.from,activeFY2.to);
   if(Math.abs(b)>0.001)closeJE2.lines.push({acc:a.id,dr:b,cr:0});
  });
  db.accounts.filter(function(a){return a.type==='Expense'&&!a.isMain;}).forEach(function(a){
   var b=accBalRange(a.id,activeFY2.from,activeFY2.to);
   if(Math.abs(b)>0.001)closeJE2.lines.push({acc:a.id,dr:0,cr:b});
  });
  if(Math.abs(netIncome2)>0.001){
   if(netIncome2>0)closeJE2.lines.push({acc:retainedAccId,dr:0,cr:netIncome2});
   else closeJE2.lines.push({acc:retainedAccId,dr:Math.abs(netIncome2),cr:0});
  }

  // Opening JE for next year
  var nextYr=activeFY2.year+1;
  var obJE2={id:'JE-OPEN-'+nextYr,date:nextYr+'-01-01',
   desc:(lang==='ar'?'\u0623\u0631\u0635\u062f\u0629 \u0627\u0641\u062a\u062a\u0627\u062d\u064a\u0629 \u0633\u0646\u0629 ':'Opening Balances FY ')+nextYr,
   lines:[],isOpening:true,fy:nextYr};

  db.accounts.filter(function(a){return (a.type==='Asset'||a.type==='Liability'||a.type==='Equity')&&!a.isMain;}).forEach(function(a){
   var b=accBalRange(a.id,'',activeFY2.to);
   if(Math.abs(b)>0.001){
    if(a.normal==='Debit')obJE2.lines.push({acc:a.id,dr:b>0?b:0,cr:b<0?Math.abs(b):0});
    else obJE2.lines.push({acc:a.id,dr:b<0?Math.abs(b):0,cr:b>0?b:0});
   }
  });

  db.journals=db.journals||[];
  db.journals=db.journals.filter(function(j){return j.id!==closeJE2.id&&j.id!==obJE2.id;});
  if(closeJE2.lines.length>0)db.journals.push(closeJE2);
  if(obJE2.lines.length>0)db.journals.push(obJE2);

  activeFY2.status='closed';activeFY2.closedAt=today();activeFY2.netIncome=netIncome2;activeFY2.retainedAccId=retainedAccId;
  db.company.retainedAccId=retainedAccId;
  save();
  alert('\u2705 '+(lang==='ar'?'\u062a\u0645 \u0625\u063a\u0644\u0627\u0642 \u0627\u0644\u0633\u0646\u0629 \u0627\u0644\u0645\u0627\u0644\u064a\u0629 '+activeFY2.year+'\n\u0635\u0627\u0641\u064a \u0627\u0644\u062f\u062e\u0644: ':'FY '+activeFY2.year+' closed\nNet Income: ')+N(netIncome2));
  render();
 });

 on('[data-mnav]','click',function(el){
  var parts=(el.dataset.mnav||'').split(':');
  var key=parts[0],action=parts[1],idx=parseInt(parts[2]||'0');
  var st=moduleState[key];
  if(!st)return;
  var getItems=function(){
   if(key==='po')return (db.purchaseOrders||[]).slice().reverse();
   if(key==='purchases')return (db.purchaseInvoices||[]).slice().reverse();
   if(key==='sales2')return (db.salesInvoices2||[]).slice().reverse();
   if(key==='receipt')return (db.receipts||[]).slice().reverse();
   if(key==='payment')return (db.payments||[]).slice().reverse();
   return [];
  };
  var items=getItems();
  var total=items.length;
  if(action==='first'){st.idx=0;st.mode='view';}
  else if(action==='prev'){if(st.idx>0){st.idx--;st.mode='view';}}
  else if(action==='next'){if(st.idx<total-1){st.idx++;st.mode='view';}}
  else if(action==='last'){st.idx=total-1;st.mode='view';}
  else if(action==='list'){st.mode='list';}
  else if(action==='open'){st.idx=idx;st.mode='view';}
  else if(action==='new'){
   if(key==='purchases'){tPI={isReturn:false};modal='pi';}
   else if(key==='sales2'){tSI={isReturn:false};modal='si';}
   else if(key==='po'){tPO={};modal='po';}
   else if(key==='receipt'){modal='rcpt';}
   else if(key==='payment'){modal='pymt';}
   render();return;
  }
  else if(action==='edit'){
   var cur=items[st.idx];if(!cur)return;
   if(key==='po'){tPO=Object.assign({},cur,{editId:cur.id,items:cur.items?cur.items.map(function(i){return Object.assign({},i);}):[]});modal='po';}
  }
  else if(action==='print'){
   var cur2=items[st.idx];if(!cur2)return;
   if(key==='purchases')printPurchaseInvoice(cur2.id);
   else if(key==='sales2')printSalesInvoice(cur2.id);
  }
  else if(action==='view'){
   var cur3=items[st.idx];if(!cur3)return;
   if(key==='purchases')printPurchaseInvoice(cur3.id);
   else if(key==='sales2')printSalesInvoice(cur3.id);
  }
  else if(action==='post'){
   var cur4=items[st.idx];if(!cur4||cur4.posted)return;
   var isAr4=lang==='ar';
   var co4=db.company;
   var vatRate4=co4.vatRate||15;

   if(key==='sales2'){
    // Sales Invoice → Dr. Receivable / Cr. Revenue + VAT
    var sub4=(cur4.lines||[]).reduce(function(s,l){return s+l.qty*l.price;},0);
    var vat4=(cur4.lines||[]).reduce(function(s,l){return s+l.qty*l.price*(l.vat||vatRate4)/100;},0);
    var tot4=sub4+vat4;
    // Find accounts
    var revAcc=db.accounts.find(function(a){return a.type==='Revenue'&&!a.isMain&&(a.name.indexOf('Local Sales')>-1||a.name.indexOf('4101-01')>-1);});
    if(!revAcc)revAcc=db.accounts.filter(function(a){return a.type==='Revenue'&&!a.isMain;})[0];
    var vatAcc=db.accounts.find(function(a){return a.id==='2103-01'||a.name.indexOf('VAT Collected')>-1;});
    var recAcc=db.accounts.find(function(a){return a.id==='1103-01'||a.name.indexOf('Local Customers')>-1;});
    if(!recAcc)recAcc=db.accounts.filter(function(a){return a.type==='Asset'&&!a.isMain&&(a.name.indexOf('Receiv')>-1||a.name.indexOf('Customer')>-1);})[0];
    // Check linked customer account
    if(cur4.customerId){var cus4=db.customers.find(function(c){return c.id===cur4.customerId;});if(cus4&&cus4.linkedAccId){var la4=db.accounts.find(function(a){return a.id===cus4.linkedAccId;});if(la4)recAcc=la4;}}
    if(!revAcc){alert(isAr4?'لم يتم العثور على حساب إيرادات. تأكد من دليل الحسابات':'Revenue account not found in Chart of Accounts.');return;}
    if(!recAcc){alert(isAr4?'لم يتم العثور على حساب الذمم المدينة':'Receivable account not found.');return;}
    var jeLines4=[{acc:recAcc.id,dr:tot4,cr:0}];
    if(vatAcc&&vat4>0)jeLines4.push({acc:vatAcc.id,dr:0,cr:vat4});
    jeLines4.push({acc:revAcc.id,dr:0,cr:sub4});
    var je4={id:'JE'+String(db.journals.length+1).padStart(3,'0'),date:cur4.date,desc:(isAr4?'فاتورة مبيعات: ':'Sales Invoice: ')+cur4.id+' — '+(cur4.customerName||''),lines:jeLines4};
    db.journals.push(je4);
    cur4.posted=true;cur4.jeId=je4.id;
    save();render();
    alert('✅ '+(isAr4?'تم ترحيل الفاتورة وإنشاء قيد: ':'Invoice posted, JE created: ')+je4.id);
   }
   else if(key==='purchases'){
    // Purchase Invoice → Dr. Expense/Inventory + VAT / Cr. Payable
    var sub5=(cur4.lines||[]).reduce(function(s,l){return s+l.qty*l.cost;},0);
    var vat5=(cur4.lines||[]).reduce(function(s,l){return s+l.qty*l.cost*(l.vat||vatRate4)/100;},0);
    var tot5=sub5+vat5;
    var invAcc5=db.accounts.find(function(a){return a.id==='1104-01'||a.name.indexOf('Merchandise Inventory')>-1;});
    if(!invAcc5)invAcc5=db.accounts.filter(function(a){return a.type==='Expense'&&!a.isMain;})[0];
    var vatInAcc5=db.accounts.find(function(a){return a.id==='1105-03'||a.name.indexOf('VAT Input')>-1;});
    var payAcc5=db.accounts.find(function(a){return a.id==='2101-01'||a.name.indexOf('Local Suppliers')>-1;});
    if(!payAcc5)payAcc5=db.accounts.filter(function(a){return a.type==='Liability'&&!a.isMain&&(a.name.indexOf('Payable')>-1||a.name.indexOf('Supplier')>-1);})[0];
    if(cur4.supplierId){var sup5=db.suppliers.find(function(s){return s.id===cur4.supplierId;});if(sup5&&sup5.linkedAccId){var la5=db.accounts.find(function(a){return a.id===sup5.linkedAccId;});if(la5)payAcc5=la5;}}
    if(!invAcc5){alert(isAr4?'لم يتم العثور على حساب المخزون أو المشتريات':'Inventory/Expense account not found.');return;}
    if(!payAcc5){alert(isAr4?'لم يتم العثور على حساب الموردين':'Payable account not found.');return;}
    var jeLines5=[{acc:invAcc5.id,dr:sub5,cr:0}];
    if(vatInAcc5&&vat5>0)jeLines5.push({acc:vatInAcc5.id,dr:vat5,cr:0});
    jeLines5.push({acc:payAcc5.id,dr:0,cr:tot5});
    var je5={id:'JE'+String(db.journals.length+1).padStart(3,'0'),date:cur4.date,desc:(isAr4?'فاتورة مشتريات: ':'Purchase Invoice: ')+cur4.id+' — '+(cur4.supplierName||''),lines:jeLines5};
    db.journals.push(je5);
    cur4.posted=true;cur4.jeId=je5.id;
    save();render();
    alert('✅ '+(isAr4?'تم ترحيل الفاتورة وإنشاء قيد: ':'Invoice posted, JE created: ')+je5.id);
   }
  }
  else if(action==='delete'){
   var cur5=items[st.idx];if(!cur5)return;
   if(!confirm('Delete '+cur5.id+'?'))return;
   if(key==='po')db.purchaseOrders=(db.purchaseOrders||[]).filter(function(x){return x.id!==cur5.id;});
   else if(key==='purchases')db.purchaseInvoices=(db.purchaseInvoices||[]).filter(function(x){return x.id!==cur5.id;});
   else if(key==='sales2')db.salesInvoices2=(db.salesInvoices2||[]).filter(function(x){return x.id!==cur5.id;});
   else if(key==='receipt')db.receipts=(db.receipts||[]).filter(function(x){return x.ref!==cur5.ref;});
   else if(key==='payment')db.payments=(db.payments||[]).filter(function(x){return x.ref!==cur5.ref;});
   st.idx=Math.max(0,st.idx-1);st.mode='list';save();
  }
  render();
 });

function calcVATLines(){
 // Called when Debit/Credit changes - update VAT line amounts
 tJE.lines.forEach(function(l,i){
  if(!l.vat||l.isVatLine)return;
  var vatRate=Number(l.vat)||0;
  if(!vatRate)return;
  var baseAmt=(Number(l.dr)||0)||(Number(l.cr)||0);
  var vatAmt=Math.round(baseAmt*vatRate/100*100)/100;
  // Find and update corresponding VAT line with correct DR/CR
  var vatLine2=tJE.lines.find(function(vl){return vl.isVatLine&&vl.vatFor===i;});
  if(vatLine2){
   vatLine2.dr=0;vatLine2.cr=0;
   if(Number(l.dr)>0)vatLine2.dr=vatAmt;  // Expense: VAT Input DEBIT
   else vatLine2.cr=vatAmt;               // Revenue: VAT Payable CREDIT
  }
 });
}
function jeHint(){
 var tD=tJE.lines.reduce(function(s,l){return s+Number(l.dr||0);},0);
 var tC=tJE.lines.reduce(function(s,l){return s+Number(l.cr||0);},0);
 var el=document.getElementById('jeHint');if(!el)return;
 var diff=Math.abs(tD-tC);el.textContent=diff<0.01?'Debits = Credits':'Difference: '+N(diff);el.style.color=diff<0.01?'var(--gn)':'var(--am)';
}

 if(HAS_CLOUD&&fbRef){

<script>
// ── Global License Functions ──────────────────────────────────
window.activateLicense=function(key){
 var msg=document.getElementById('licMsg');
 var isAr=window.lang==='ar';
 if(!key||!/^MIZAN-[A-Z0-9]{4,8}-[A-Z0-9]{4,8}-[A-Z0-9]{4,8}$/.test(key)){
  if(msg)msg.innerHTML='<span style="color:#EF4444">❌ '+(isAr?'صيغة المفتاح غير صحيحة':'Invalid key format')+'</span>';
  return;
 }
 if(msg)msg.innerHTML='<span style="color:#6B7280">'+(isAr?'جاري التحقق...':'Verifying...')+'</span>';
 // Try Firebase first
 var fbAvail=typeof firebase!=='undefined'&&firebase.database;
 if(fbAvail){
  try{
   firebase.database().ref('mizan_licenses/'+key).once('value').then(function(snap){
    var d=snap.val();
    if(!d){
     if(msg)msg.innerHTML='<span style="color:#EF4444">❌ '+(isAr?'المفتاح غير موجود':'Key not found')+'</span>';
     return;
    }
    if(d.active===false){
     if(msg)msg.innerHTML='<span style="color:#EF4444">❌ '+(isAr?'هذا المفتاح معطل. تواصل مع المدرب':'Key disabled. Contact trainer')+'</span>';
     return;
    }
    if(d.expiry&&new Date(d.expiry)<new Date()){
     if(msg)msg.innerHTML='<span style="color:#EF4444">❌ '+(isAr?'انتهت صلاحية المفتاح':'Key expired')+'</span>';
     return;
    }
    var lic={key:key,traineeName:d.traineeName||'',course:d.course||'',expiry:d.expiry||'',activatedAt:new Date().toISOString()};
    localStorage.setItem('mizan_license',JSON.stringify(lic));
    window.licenseState={checked:true,valid:true,data:lic,error:''};
    if(msg)msg.innerHTML='<span style="color:#059669">✅ '+(isAr?'تم التفعيل! مرحباً '+lic.traineeName:'Activated! Welcome '+lic.traineeName)+'</span>';
    setTimeout(function(){if(window.render)window.render();},1200);
   }).catch(function(){
    // Offline — accept key
    var lic={key:key,traineeName:'',course:'',expiry:'',activatedAt:new Date().toISOString(),offline:true};
    localStorage.setItem('mizan_license',JSON.stringify(lic));
    window.licenseState={checked:true,valid:true,data:lic,error:''};
    if(msg)msg.innerHTML='<span style="color:#059669">✅ '+(isAr?'تم التفعيل':'Activated')+'</span>';
    setTimeout(function(){if(window.render)window.render();},1000);
   });
  }catch(e){
   var lic={key:key,traineeName:'',course:'',expiry:'',activatedAt:new Date().toISOString(),offline:true};
   localStorage.setItem('mizan_license',JSON.stringify(lic));
   window.licenseState={checked:true,valid:true,data:lic,error:''};
   setTimeout(function(){if(window.render)window.render();},500);
  }
 } else {
  // No Firebase — accept any valid format key
  var lic={key:key,traineeName:'',course:'',expiry:'',activatedAt:new Date().toISOString(),offline:true};
  localStorage.setItem('mizan_license',JSON.stringify(lic));
  window.licenseState={checked:true,valid:true,data:lic,error:''};
  if(msg)msg.innerHTML='<span style="color:#059669">✅ '+(isAr?'تم التفعيل':'Activated')+'</span>';
  setTimeout(function(){if(window.render)window.render();},1000);
 }
};
</script>
<script>
// ── Global License Admin Functions (outside IIFE) ─────────────
var PROGRAM_URL='https://loloo31-oss.github.io/Mizan-IQ-Student/activate.html';
// Turns whatever the admin typed into a WhatsApp-ready international
// number. IMPORTANT: this only auto-adds Saudi Arabia's country code
// (966) for a number typed in EXACT Saudi local mobile format (05 + 8
// digits = 10 digits total) — that used to be a much looser check
// ("starts with 05", or "starts with 5 and is 9 digits") that also
// matched other Gulf countries' own local mobile formats (e.g. the UAE's
// 05X XXX XXXX is the same length/shape), silently corrupting those into
// a wrong Saudi number. Anything else — a number already starting with +
// or 00, or typed with its own country code and no leading 0 — is sent
// through untouched, so trainers should type non-Saudi numbers WITH their
// country code (e.g. 971501234567 for the UAE, no leading zero).
function formatWaPhone(raw){
 var p=String(raw||'').trim();
 if(p.charAt(0)==='+')p=p.slice(1);
 p=p.replace(/[^0-9]/g,'');
 if(p.indexOf('00')===0)p=p.slice(2);
 else if(p.indexOf('05')===0&&p.length===10)p='966'+p.slice(1);
 return p;
}
window.doLicSave=function(){
 var isAr=window.lang==='ar';
 var nm=((document.getElementById('lic-name')||{}).value||'').trim();
 if(!nm){alert(isAr?'أدخل اسم المتدرب':'Enter trainee name');return;}
 var key2=((document.getElementById('lic-key')||{}).value||'').trim();
 // Derive the expiry straight from the generated key's own embedded date
 // segment (MIZAN-partA-partB-YYYYMMDD-checksum), instead of recomputing
 // it separately from the duration dropdown — this guarantees the admin's
 // bookkeeping record always matches what's actually baked into the key,
 // whatever duration unit (days/months) was used to generate it.
 var expCode2=(key2.split('-')[3]||'00000000');
 var exp2=(expCode2==='00000000')?'':(expCode2.slice(0,4)+'-'+expCode2.slice(4,6)+'-'+expCode2.slice(6,8));
 var lic2={key:key2,traineeName:nm,
  phone:((document.getElementById('lic-phone')||{}).value||'').trim(),
  email:((document.getElementById('lic-email')||{}).value||'').trim(),
  course:((document.getElementById('lic-course')||{}).value||''),
  expiry:exp2,
  price:parseFloat(((document.getElementById('lic-price')||{}).value)||'0'),
  active:true,createdAt:new Date().toISOString()};
 if(!window.db)return;
 window.db.licenses=window.db.licenses||[];
 window.db.licenses.push(lic2);
 window.save();
 window.licAdminState.showForm=false;
 window.render();
 // Publish the same license to the real backend (Realtime Database) so a
 // trainee can actually activate it, and so Suspend/Renew below take real,
 // immediate effect instead of only updating this admin's own local table.
 if(window.ensureServiceAdminAuth&&window.mizanLicensesRef){
  window.ensureServiceAdminAuth().then(function(){
   return window.mizanLicensesRef.child(key2).set({
    traineeName:nm,phone:lic2.phone,email:lic2.email,course:lic2.course,
    expiry:exp2,active:true,createdAt:lic2.createdAt
   });
  }).catch(function(err){
   console.error('Failed to publish license to Firebase',err);
   alert((isAr?'تحذير: تم الحفظ محليًا لكن فشل رفع الترخيص للخادم — قد لا يستطيع المتدرب التفعيل. التفاصيل: ':'Warning: saved locally but publishing the license to the server failed — the trainee may not be able to activate. Details: ')+(err&&err.message?err.message:err));
  });
 }
 // Open WhatsApp / Gmail SYNCHRONOUSLY, right here in the click handler —
 // not inside a setTimeout. Browsers only allow window.open() to bypass
 // the popup blocker when it happens as a direct, immediate result of a
 // user gesture (the click on "Save & Send"); delaying it even by a few
 // hundred milliseconds loses that "user activation" and the tab either
 // gets blocked outright or opens blank/broken — which is exactly the bug
 // this replaces.
 var msg=licMsgFor(lic2);
 // WhatsApp — only if a phone number was entered.
 if(lic2.phone){
  var phone=formatWaPhone(lic2.phone);
  // web.whatsapp.com/send opens straight into the chat in an ALREADY-
  // authenticated browser tab — wa.me instead bounces through an extra
  // api.whatsapp.com landing page ("Continue to WhatsApp Web") whose
  // click-through navigation was landing on a blank/stuck page for some
  // users. Going directly to web.whatsapp.com skips that hop entirely.
  var waUrl=phone.length>=9?'https://web.whatsapp.com/send?phone='+phone+'&text='+encodeURIComponent(msg):'https://wa.me/?text='+encodeURIComponent(msg);
  window.open(waUrl,'_blank');
 }
 // Email via Gmail's web compose window (opens directly in the browser
 // instead of going through mailto:, which is controlled by the OS's
 // default mail-handler setting and was opening Edge/Outlook instead of
 // Gmail) — only if an email was entered. Independent of the phone/
 // WhatsApp step above: both can fire, either can fire alone, and both
 // fire in the same synchronous click for the same reason as above.
 if(lic2.email){
  var subject=encodeURIComponent((isAr?'مفتاح تفعيل برنامج Mizan IQ — ':'Mizan IQ activation key — ')+lic2.course);
  window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(lic2.email)+'&su='+subject+'&body='+encodeURIComponent(msg),'_blank');
 }
};
window.licNew=function(){if(window.licAdminState)window.licAdminState.showForm=!window.licAdminState.showForm;if(window.render)window.render();};
window.licCancel=function(){if(window.licAdminState)window.licAdminState.showForm=false;if(window.render)window.render();};
window.licRegenKey=function(){
 if(!window.generateLicenseKey)return;
 var moEl=document.getElementById('lic-months');
 var mo=moEl?moEl.value:'12';
 var g=window.generateLicenseKey('','',mo);
 var k=document.getElementById('lic-key');
 if(k)k.value=g.key;
};

// These were referenced by the license table buttons but never defined —
// added so ⏸/▶/🔄/📱/📧 actually work. Suspend/Activate/Renew below update
// this admin's own local table AND push the same change to the real
// /licenses/{key} record on the server (via licPublish), so they take
// real, immediate effect on the trainee's copy too — not just here.
function licFind(key){return (window.db&&window.db.licenses||[]).find(function(x){return x.key===key;});}
function licMsgFor(l){
 var isAr=window.lang==='ar';
 return isAr?
  ('مرحباً '+l.traineeName+' 🎓\n\nنسختك من برنامج Mizan IQ جاهزة!\n\n🔑 مفتاح التفعيل:\n'+l.key+'\n\n📅 صالح حتى: '+(l.expiry||'غير محدود')+'\n📋 الدورة: '+l.course+'\n\nخطوات التفعيل:\n1️⃣ افتح رابط البرنامج:\n'+PROGRAM_URL+'\n2️⃣ أدخل المفتاح\n3️⃣ اضغط تفعيل البرنامج\n\n🌟 خالد العمري — Mizan IQ\nloloo31@gmail.com'):
  ('Hello '+l.traineeName+' 🎓\n\nYour Mizan IQ license is ready!\n\n🔑 Activation Key:\n'+l.key+'\n\n📅 Valid until: '+(l.expiry||'Unlimited')+'\n📋 Course: '+l.course+'\n\nActivation steps:\n1️⃣ Open the program link:\n'+PROGRAM_URL+'\n2️⃣ Enter the key above\n3️⃣ Click "Activate Program"\n\nGood luck! 🌟\nKhalid Al-Omary — Mizan IQ');
}
// Pushes a partial update to the real /licenses/{key} record (after
// signing in as the fixed service account) so Suspend/Activate/Renew
// take effect immediately for the trainee too, not just in this admin's
// own local table. Failures are logged + surfaced but don't block the
// local update from applying.
function licPublish(key,patch){
 if(!window.ensureServiceAdminAuth||!window.mizanLicensesRef)return;
 window.ensureServiceAdminAuth().then(function(){
  return window.mizanLicensesRef.child(key).update(patch);
 }).catch(function(err){
  console.error('Failed to sync license change to Firebase',err);
  var isAr=window.lang==='ar';
  alert((isAr?'تحذير: التغيير حُفظ محليًا فقط ولم يصل للخادم. التفاصيل: ':'Warning: this change saved locally only and did not reach the server. Details: ')+(err&&err.message?err.message:err));
 });
}
window.licSuspend=function(key){
 var l=licFind(key);if(!l)return;
 l.active=false;
 if(window.save)window.save();
 if(window.render)window.render();
 licPublish(key,{active:false});
};
window.licActivate=function(key){
 var l=licFind(key);if(!l)return;
 l.active=true;
 if(window.save)window.save();
 if(window.render)window.render();
 licPublish(key,{active:true});
};
window.licRenew=function(key){
 var l=licFind(key);if(!l)return;
 var isAr=window.lang==='ar';
 var mo=parseInt(prompt(isAr?'كم شهر تريد تمديد الترخيص؟':'Extend by how many months?','12')||'0',10);
 if(!mo)return;
 var base=(l.expiry&&new Date(l.expiry)>new Date())?new Date(l.expiry):new Date();
 base.setMonth(base.getMonth()+mo);
 l.expiry=base.toISOString().slice(0,10);
 l.active=true;
 if(window.save)window.save();
 if(window.render)window.render();
 licPublish(key,{expiry:l.expiry,active:true});
};
window.licWA=function(key){
 var l=licFind(key);if(!l)return;
 var isAr=window.lang==='ar';
 // Fall back to the old single "contact" field for licenses issued before
 // the phone/email split, so resending an old license still works.
 var phoneRaw=l.phone||(l.contact&&l.contact.indexOf('@')===-1?l.contact:'')||'';
 if(!phoneRaw){alert(isAr?'لا يوجد رقم جوال مسجل لهذا المتدرب':'No phone number on file for this trainee');return;}
 var phone=formatWaPhone(phoneRaw);
 // web.whatsapp.com/send opens straight into the chat (see the matching
 // comment in doLicSave above for why this replaces wa.me here too).
 var waUrl=phone.length>=9?('https://web.whatsapp.com/send?phone='+phone+'&text='+encodeURIComponent(licMsgFor(l))):('https://wa.me/?text='+encodeURIComponent(licMsgFor(l)));
 window.open(waUrl,'_blank');
};
window.licEmail=function(key){
 var l=licFind(key);if(!l)return;
 var isAr=window.lang==='ar';
 // Same backward-compat fallback as licWA above.
 var email=l.email||(l.contact&&l.contact.indexOf('@')>-1?l.contact:'')||'';
 if(!email){alert(isAr?'لا يوجد إيميل مسجل لهذا المتدرب':'No email on file for this trainee');return;}
 var subject=encodeURIComponent((isAr?'مفتاح تفعيل برنامج Mizan IQ — ':'Mizan IQ activation key — ')+l.course);
 // Gmail web-compose link instead of mailto: (mailto: is OS-default-handler
 // controlled and was opening Edge/Outlook instead of Gmail).
 window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(email)+'&su='+subject+'&body='+encodeURIComponent(licMsgFor(l)),'_blank');
};
