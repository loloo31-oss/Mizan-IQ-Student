<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفعيل Mizan IQ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D3B6E,#185FA5);font-family:Arial,sans-serif;direction:rtl}
.box{background:#fff;border-radius:20px;padding:36px;width:460px;max-width:95vw;box-shadow:0 24px 64px rgba(0,0,0,.3);text-align:center}
.brand{font-size:34px;font-weight:900;margin-bottom:6px}
.brand .b1{color:#185FA5}.brand .b2{color:#B8860B}
.sub{font-size:12px;color:#888;margin-bottom:20px}
.warn{background:#FEF3C7;border:1px solid #F59E0B;border-radius:10px;padding:12px;margin-bottom:18px;font-size:13px;color:#92400E}
.err{background:#FEE2E2;border:1px solid #EF4444;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px;color:#B91C1C;display:none}
.section{background:#F8FAFC;border-radius:12px;padding:16px;margin-bottom:14px;text-align:right}
.section h3{font-size:12px;font-weight:700;color:#374151;margin-bottom:10px;display:flex;align-items:center;gap:6px}
label{font-size:11px;font-weight:700;color:#6B7280;display:block;margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:13px;outline:none;transition:border .2s;background:#fff;color:#111;margin-bottom:10px}
input:focus{border-color:#185FA5}
input#keyInput{font-family:monospace;letter-spacing:2px;text-align:center;text-transform:uppercase;font-size:14px}
.btn{width:100%;padding:13px;background:#185FA5;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:all .2s}
.btn:hover{background:#0D3B6E;transform:translateY(-1px)}
.btn:disabled{background:#9CA3AF;cursor:not-allowed;transform:none}
.msg{font-size:13px;min-height:22px;margin-top:10px;color:#6B7280}
.footer{font-size:11px;color:#9CA3AF;margin-top:18px;padding-top:14px;border-top:1px solid #E5E7EB}
.footer a{color:#185FA5;text-decoration:none}
.success{background:#D1FAE5;border:1px solid #059669;border-radius:8px;padding:14px;margin-top:10px;color:#065F46;font-size:14px;display:none}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="b1">Mizan </span><span class="b2">IQ</span></div>
  <div class="sub">الذكاء الذي يفهم أرقامك</div>
  <div class="warn">🔐 هذه النسخة محمية بحقوق الملكية الفكرية<br><small>خالد العمري — Mizan IQ</small></div>
  
  <div class="err" id="errBox"></div>

  <!-- Step 1: Activation Key -->
  <div class="section" id="step1">
    <h3>🔑 الخطوة ١ — مفتاح التفعيل</h3>
    <label>أدخل المفتاح الذي أرسله لك المدرب</label>
    <input type="text" id="keyInput" placeholder="MIZAN-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
  </div>

  <!-- Step 2: Create Account -->
  <div class="section" id="step2">
    <h3>👤 الخطوة ٢ — إنشاء حسابك</h3>
    <label>اسم المستخدم (للدخول للبرنامج)</label>
    <input type="text" id="userInput" placeholder="مثال: omar123" autocomplete="off" spellcheck="false">
    <label>كلمة المرور</label>
    <input type="password" id="passInput" placeholder="٤ أحرف على الأقل" autocomplete="off">
    <label>تأكيد كلمة المرور</label>
    <input type="password" id="pass2Input" placeholder="أعد كتابة كلمة المرور" autocomplete="off">
  </div>

  <button class="btn" id="activateBtn">🚀 تفعيل البرنامج والدخول</button>
  <div class="msg" id="msgBox"></div>
  <div class="success" id="successBox">✅ تم التفعيل! جاري فتح البرنامج...</div>

  <div class="footer">
    للمساعدة تواصل مع المدرب:<br>
    خالد العمري — <a href="mailto:loloo31@gmail.com">loloo31@gmail.com</a>
  </div>
</div>

<script>
var KEY_PATTERN = /^MIZAN-[A-Z0-9]{4,8}-[A-Z0-9]{4,8}-[0-9]{8}-[A-Z0-9]{4,8}$/;

var keyInp  = document.getElementById('keyInput');
var userInp = document.getElementById('userInput');
var passInp = document.getElementById('passInput');
var pass2   = document.getElementById('pass2Input');
var btn     = document.getElementById('activateBtn');
var msg     = document.getElementById('msgBox');
var errBox  = document.getElementById('errBox');
var success = document.getElementById('successBox');

// Auto uppercase key + strip anything that isn't A-Z/0-9/hyphen.
// This matters because keys are usually pasted in from WhatsApp/email —
// those can carry invisible characters (bidi marks, stray spaces) around
// a Latin string embedded in Arabic text, which silently breaks the
// format check even though the key "looks" right on screen.
function sanitizeKey(v){
  return (v || '')
    .toUpperCase()
    .replace(/[‐-―−﹘﹣－]/g, '-') // various dash look-alikes -> plain hyphen
    .replace(/[^A-Z0-9-]/g, ''); // drop anything else (invisible bidi marks, stray spaces, etc.)
}
keyInp.addEventListener('input', function(){
  this.value = sanitizeKey(this.value);
});
keyInp.addEventListener('paste', function(){
  var el = this;
  setTimeout(function(){ el.value = sanitizeKey(el.value); }, 0);
});

// Enter key support
[keyInp, userInp, passInp, pass2].forEach(function(el){
  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter') doActivate();
  });
});

btn.addEventListener('click', doActivate);

function showErr(text){
  errBox.textContent = '⚠️ ' + text;
  errBox.style.display = 'block';
  btn.disabled = false;
  msg.textContent = '';
  setTimeout(function(){ errBox.style.display='none'; }, 4000);
}

// IMPORTANT: must produce EXACTLY the same hash as hashPwd() in index.html,
// otherwise the password saved here will never match at login.
function hashStr(s){
  var h = 0;
  for(var i=0; i<s.length; i++){
    h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  }
  return h.toString(36);
}

// ── License key verification (must mirror index.html exactly) ──
var LICENSE_SALT='MzIQ-9Kf3-Secret-2026-XyQ';
function licStrHash(s){
  var h=0;
  for(var i=0;i<s.length;i++){h=(Math.imul(31,h)+s.charCodeAt(i))|0;}
  return h;
}
function licChecksum(partA,partB,expCode){
  var h=licStrHash(partA+'|'+partB+'|'+expCode+'|'+LICENSE_SALT);
  var s=Math.abs(h).toString(36).toUpperCase();
  while(s.length<6)s='0'+s;
  return s.slice(0,6);
}
function isValidLicenseKey(k){
  var parts=k.split('-');
  if(parts.length!==5||parts[0]!=='MIZAN')return false;
  return licChecksum(parts[1],parts[2],parts[3])===parts[4];
}
// '00000000' means a lifetime key (no expiry). Returns '' for that case,
// otherwise 'YYYY-MM-DD'.
function licExpiryFromKey(k){
  var expCode=k.split('-')[3];
  if(!expCode||expCode==='00000000')return '';
  return expCode.slice(0,4)+'-'+expCode.slice(4,6)+'-'+expCode.slice(6,8);
}

function doActivate(){
  errBox.style.display = 'none';
  var key  = sanitizeKey(keyInp.value.trim());
  keyInp.value = key; // reflect the cleaned value back so what's shown = what's checked
  var user = userInp.value.trim();
  var pass = passInp.value;
  var pass2v = pass2.value;

  // Validate
  if(!key)         { showErr('أدخل مفتاح التفعيل'); return; }
  if(!KEY_PATTERN.test(key)) { showErr('صيغة المفتاح غير صحيحة — يجب أن يبدأ بـ MIZAN- (المُدخل حاليًا: '+key+')'); return; }
  if(!isValidLicenseKey(key)) { showErr('هذا المفتاح غير صالح — تأكد من نسخه كاملاً بدون أخطاء، أو تواصل مع المدرب'); return; }
  var keyExpiry = licExpiryFromKey(key);
  if(keyExpiry && new Date(keyExpiry) < new Date()) { showErr('انتهت صلاحية هذا المفتاح. تواصل مع المدرب للحصول على مفتاح جديد'); return; }
  if(!user)        { showErr('أدخل اسم المستخدم'); return; }
  if(user.length < 3) { showErr('اسم المستخدم 3 أحرف على الأقل'); return; }
  if(!pass)        { showErr('أدخل كلمة المرور'); return; }
  if(pass.length < 4) { showErr('كلمة المرور 4 أحرف على الأقل'); return; }
  if(pass !== pass2v) { showErr('كلمة المرور غير متطابقة'); return; }

  btn.disabled = true;
  msg.textContent = 'جاري التفعيل...';

  // Save license
  var lic = {
    key: key,
    valid: true,
    username: user,
    expiry: keyExpiry, // '' = lifetime key; index.html blocks access once this date passes
    activatedAt: new Date().toISOString()
  };
  localStorage.setItem('mizan_license', JSON.stringify(lic));

  // Save pending user account
  var account = {
    username: user,
    passwordHash: hashStr(pass),
    name: user,
    role: 'user',
    active: true
  };
  localStorage.setItem('mizan_pending_user', JSON.stringify(account));

  // Show success
  success.style.display = 'block';
  msg.textContent = '';

  // Redirect to main app
  setTimeout(function(){
    window.location.href = 'index.html';
  }, 2000);
}
</script>
</body>
</html>
